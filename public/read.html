<!DOCTYPE html>

<head>

<title>阅读</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Microsoft YaHei','PingFang SC',serif;
    background:#f5f1eb; color:#3e3232;
    min-height:100vh;
    animation:fadeIn 0.4s ease;
    transition:background 0.4s;
  }
  body.eye-mode { background:#c8e6c9; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .top-bar {
    position:sticky; top:0; z-index:100;
    background:linear-gradient(135deg,#5d4037,#795548);
    color:#fff; padding:12px 20px;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.15);
  }
  .back-btn {
    color:#fff; text-decoration:none; font-size:14px;
    padding:6px 16px; border:1px solid rgba(255,255,255,0.4);
    border-radius:20px; transition:all 0.3s; white-space:nowrap;
    cursor:pointer; background:none;
  }
  .back-btn:hover { background:rgba(255,255,255,0.15); }
  .book-title { font-size:18px; font-weight:700; flex:1; }
  .book-author { font-size:13px; opacity:0.75; }

  .tools {
    position:sticky; top:56px; z-index:99;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(10px);
    padding:10px 20px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; border-bottom:1px solid #e0d8cd;
    font-size:14px;
  }
  .tools button, .tools select {
    padding:6px 14px; border:1px solid #ccc; border-radius:16px;
    background:#fff; cursor:pointer; font-size:13px; font-family:inherit;
    transition:all 0.2s; color:#555;
  }
  .tools button:hover { background:#f5f0eb; border-color:#999; }
  .tools button.active { background:#5d4037; color:#fff; border-color:#5d4037; }
  .tools select { appearance:none; padding-right:28px; }
  .chapter-select { min-width:180px; }

  .reading-area {
    max-width:780px; margin:0 auto; padding:32px 28px 60px;
    line-height:2.2; font-size:17px; letter-spacing:0.03em;
    text-align:justify;
  }
  .chapter-title { font-size:26px; font-weight:700; text-align:center; margin:20px 0 36px; color:#4e342e; }
  .chapter-content { white-space:pre-wrap; }
  .chapter-content p { margin-bottom:1em; text-indent:2em; }

  .chapter-nav {
    display:flex; justify-content:center; align-items:center; gap:20px; padding:24px 0 40px;
  }
  .chapter-nav button {
    padding:10px 24px; border:1px solid #ccc; border-radius:24px;
    background:#fff; cursor:pointer; font-size:15px; font-family:inherit;
    transition:all 0.2s; color:#5d4037;
  }
  .chapter-nav button:hover { background:#5d4037; color:#fff; border-color:#5d4037; }
  .chapter-nav button:disabled { opacity:0.3; cursor:default; }
  .chapter-nav button:disabled:hover { background:#fff; color:#5d4037; }
  .chapter-nav .ch-indicator { font-size:15px; color:#888; }

  @media (max-width:600px) {
    .top-bar { padding:10px 14px; gap:10px; }
    .book-title { font-size:16px; }
    .tools { padding:8px 14px; gap:8px; top:48px; }
    .tools button, .tools select { padding:5px 10px; font-size:12px; }
    .reading-area { padding:20px 16px 40px; font-size:16px; }
    .chapter-title { font-size:22px; }

<script type="text/plain" id="novel1"> 第一章：窗口2042年，时空社会学研究所。林知予把申请表推到周教授面前的时候，手指比平时凉了两度。“短期投射，”她说，“预实验。测试一下新校准的感官精度。”周教授没接表。他靠在椅背上，从镜片后面看她。林知予跟了他三年，知道这个表情——他在等她继续说。她没继续说。她说完了。“观测目标？”“2018年，一个选秀节目的录制现场。”她把第二份文件推过去，课题摘要、观测坐标、伦理声明，格式规整得像教科书。“课题方向是‘早期网络亚文化中的公众情绪传播’。2018年是梗文化的爆发期，现场观测能捕捉到第一手的群体情绪数据。”周教授扫了一眼文件。“观测对象？”“群体。主要是现场观众和工作人员。”他没再追问。批了。林知予拿着签好的申请表走出办公室，在走廊上站了几秒。她手里的纸张边缘被捏出了细微的褶皱。她当然说谎了。她的观测目标从来不是“群体”，是一个人。一个在2042年的历史记载中被定义为“本世纪初文化悲剧”的年轻音乐人。她在十四岁那年的历史课本上第一次读到他的故事。寥寥几段文字，配了一张舞台照。照片里他穿着白色演出服，金色亮片从头顶飘下来。图注写的是：最后一场演出后，当事人于酒店身亡，年仅二十六岁。她当时盯着那张照片看了很久。不是同情——十四岁的她还不完全理解悲剧。她只是觉得有一种说不清楚的不对劲。这个人看起来那么亮，那么活生生。他扛过了全网玩梗，扛过了天价解约官司，扛过了私生活谣言——他扛过了一次又一次。就差最后一步。为什么没有人站在那扇门外面。这个问题跟了她十年。现在她二十四岁，是周教授手下最被看好的研究生之一。她的专业方向是历史社会学，不是时空观测。但她花了两年时间自学了投射装置的全部操作流程，考了观测资格证，在模拟舱里跑了上百个小时的感官校准训练。导师以为她是跨方向拓展研究方法。她确实是。但不是为了学术。她想亲眼看看。不是为了改变任何东西——她做不到，规则不允许。她只是想亲眼看看，那个在教科书上被定义为“悲剧”的人，在活着的时候，是什么样子。他紧张的时候会不会捏裤缝线。他练舞累的时候会不会对着镜子皱眉。他被嘲笑之后，会不会在没有人注意的角落露出任何一丝想放弃的表情。她想知道他是怎么扛的。因为如果能弄清楚他是怎么扛的，也许就能理解——为什么最后一步没扛过去。也许能在那个答案里，找到一些关于人如何在重压下生存的东西。这些东西，历史课本不会写。观测仓的门在她面前打开。林知予坐进去，把神经接口贴在太阳穴上，校准参数。她的手指在虚拟键盘上快速跳动，输入目标坐标：2018年11月20日，《偶像练习生》初舞台录制现场。系统弹出观测协议，她扫了一眼——条款已经烂熟于心。观测窗口为纯视觉与听觉投射，不包含物理交互能力。观测者在目标时代没有身体、没有身份、无法被感知、无法触碰任何物体。观测记录在任务结束后由系统自动归档，持续观测模式下数据不永久存储。这是保护观测者心理健康的机制——长期目击无法干预的事件会产生严重的无力感，不保留详细记忆是行业标准。林知予在协议末页签了字。她的拇指在确认键上方悬了一秒，然后按了下去。意识坠入光。醒过来的时候，她正站在一个走廊里。走廊很长，两侧是各种办公室的门牌。空气里飘着速溶咖啡和盒饭混杂的味道，有对讲机的电流声，有人在喊道具组谁把反光板落走廊了。她低头看自己的手——看不到。她没有手。准确地说，她在这个时代没有物理形态。她是一个悬浮在空气中的观测窗口，能看、能听，但不能触碰任何东西。现在她要去看看那个人了——在初舞台开始之前。她穿过走廊的墙壁，穿过人群，穿过正在做最后调试的灯光架和摄像机位。然后她看见了他。他坐在练习室的角落里，穿着统一的训练服，手放在膝盖上，手指无意识地捏着裤缝线。一下，一下，又松开。他在紧张。她站在他面前大概两米的位置。他看不见她。谁也不会看见她。她只是站在那里，看着他的手指捏紧又松开，看着他微微抿了一下嘴唇，看着他深吸一口气然后站起来往舞台方向走。她在心里说了一句——加油。声音很小，小到只有她自己能听见。但说出这两个字的时候，她的胸口像被什么东西轻轻撞了一下。原来亲眼看见他，和隔着资料库看，完全不同。 第二章：凝视初舞台之后，林知予没有离开。短期投射的标准操作流程是四十八小时。她在第四十七个小时的时候关掉了倒计时提醒。不是关掉整个系统——她没有那么大的权限——只是把提醒设为静音。装置继续运行，她的意识继续锚定在2018年的这个坐标上。周教授那边会怎么想，她暂时不去想。她告诉自己只是想多看几天，看看他下一场表现怎么样，看看他会不会紧张，看看他晋级之后会不会笑。后来她发现自己想看的东西越来越多。她想看他早上几点到练习室。想看他午饭吃什么。想看他膝盖上的膏药是贴一片还是两片。想看他跟队友说话时的语气，想看他被导师表扬之后的表情，想看他被批评之后会不会一个人躲到走廊尽头去。这些事资料库里都没有。资料库有舞台直拍，有后采文字稿，有淘汰赛的晋级名单。但资料库不会告诉你他吃盒饭的时候会把青椒挑出来放在盖子角落里，不会告诉你他练舞的时候会小声数拍子——声音小到只有她自己能听见，因为她现在就站在他身边不到一米的地方。他当然不知道。他正在做一个旋转动作，手臂展开，脚尖点地，核心收紧。动作很漂亮。但他落地的时候膝盖微弯了一下，几乎看不出来——但她看出来了。他在控制。膝盖不舒服，他在收着劲做。林知予蹲在他旁边。观测窗口没有物理形态，她其实不需要“蹲”——但她还是习惯性地把自己降到和他膝盖同高的位置。她看着他的膝盖，又看着他的脸。他脸上什么表情都没有，继续跳，继续数拍子，继续做下一个动作。她想：你膝盖疼。你跟谁都没说。那天晚上练习结束之后，他没有马上回宿舍。他一个人坐在练习室的地板上，背靠着镜子，把膝盖蜷起来。他从包里翻出一盒膏药——是最便宜的那种，药店十几块一盒——撕开一片贴在膝盖侧面。贴完之后他没有站起来，就那么坐着，仰头看着天花板，呼吸很慢。林知予坐在他对面。她不能给他递水，不能帮他贴膏药，不能说“你休息一下”。她只能看着他。他的睫毛在日光灯下投下很淡的阴影，喉结上下滚动了一下，像是在咽什么下去——不是水，是某种更稠的东西。她忽然想起资料库里的一句话，是他在几年后的一次采访里说的。记者问他最难的时候怎么过来的，他说：“就扛。扛不过去也扛。扛着扛着就过去了。”资料库里看到这句话的时候，她觉得他在轻描淡写。现在她坐在这里，看着他用最便宜的膏药贴膝盖，把脸对着天花板一个人咽下所有东西——她发现他没有轻描淡写。他只是把“扛”这个字拆成了几千个这样的凌晨。她在他对面坐了很久。中间他站起来，关灯，锁门，回宿舍。她跟着他走过走廊，走过熄了灯的茶水台，走过贴着晋级名单的公告栏。他走得不快，每一步都稳。走到宿舍门口的时候，他停了一下。手搭在门把手上，没有马上拧开。他就那么站了片刻，低着头，像在给自己做某种心理建设，然后推门进去。林知予站在走廊上，看着那扇关上的门，忽然意识到一件事：她不想只待几天了。她想待到他赢。她想待到最后。接下来的几周，她开始了她从未跟导师汇报过的长期观测。她每天都跟着他。早上他到练习室，她已经在角落里了——不是真的“在”，是她把观测窗口固定在了他活动范围的中心。他练舞，她看。他跟队友说话，她听。他吃饭，她蹲在桌子对面看他把青椒挑出来。她不拍照，不记录，不写观测日志。这不是研究。她早就放弃了任何学术借口。她只是想看。她看到他教一个新来的练习生跳舞。那个新人基础很差，一个简单的转身都做不稳，连续做了好几次都晃，脸涨得通红，连声说对不起。他没有露出任何不耐烦。他把动作拆成两步，放慢节奏，说：“你别想转，先想站。站稳了再转。”新人又试了一次，还是晃，但比之前好了一点。他说：“进步了。明天再练。”那天晚上新人走的时候，林知予看到他在练习室镜子角落写了几行字。她走过去看——是用白板笔写的，很小，蹲下来才看得清：膝盖不舒服。周末记得买膏药。下面还有一行，更小，她差点漏掉：今天新人进步了。好。林知予蹲在那几行字前面。他不是在写给别人看。他是在给自己写。膝盖不舒服，提醒自己买药。新人进步了，给自己一个“好”。她蹲了很久。窗外的走廊灯熄了一半，练习室的光线暗下来。她想伸手碰一下那面镜子。她知道自己碰不到。她把手指——那个不存在的、在这个时代没有任何物理形态的手指——很轻地放在那几行字前面，隔着一厘米的距离，说：“你很好。你不知道你有多好。”他当然听不到。但她说出口了。说出口的时候她才发现，这句话她不是只想对他一个人说。她想对凌晨的练习室说，想对他膝盖上那盒最便宜的膏药说，想对他吃剩的青椒和镜子上歪歪扭扭的白板笔字说。这个时代欠他的，她想用眼睛还。进入淘汰赛阶段之后，走廊里的空气开始变紧。她看见他从导师办公室回来时沉默地坐在等候室的角落，两只手交握着放在膝盖上，低头看着地面。不是被批评了——他被表扬了。但他看起来并不开心。因为同组有一个人被批评得很厉害，那个人坐在另一边，红着眼眶，周围没人说话。他沉默了很久，然后站起来，拿了一瓶水，走过去放在那个人手边。他说：“我第一轮的时候也以为自己会被淘汰。”那个人抬起头。他又说：“不会一直这样的。”林知予站在墙角。这句话是她说的。不对——不是她说的。她在这个时代没有说过任何话。但她想说这句话。她每次看到他一个人扛着所有事情的时候，都想跟他说这句话。她从来没说出来。现在他说出来了。他把一句她没说出口的话，说给了另一个需要听到的人。她想：他在传递。把他自己都没收到的那些东西——安慰、笃定、不会一直这样的——传递给别人。他不知道有人在看他。但他用他的方式，把这些东西放进去了。决赛夜那天，林知予站在舞台正中央的摄像机位旁边。她不需要找位置——观测窗口可以悬在任何地方。她选择悬在能看清他锁骨上细汗的位置。投票通道关闭，主持人打开信封，全场灯光暗了一秒，然后他的名字被念出来。四千七百万票。金色亮片从她身体里穿过。她忘了自己没有实体——亮片穿过观测窗口砸在舞台上，堆成金色的小山。他站在舞台中央，接过奖杯，手很稳。他对着话筒沉默了几秒，然后说：“谢谢在这段时间里，给过我水的人。”林知予站在亮片里。她没有给他递过水。她没有给过他任何东西。但她知道这句话不是对工作人员说的，不是对任何一个具体的人说的。他是对“有人在”说的。他可能不确定那个人是谁，但他感觉到了——有人在。她站在漫天亮片里，站在他面前不到两米的位置，说：“不用谢。”她说得很轻，声音被音乐声和尖叫声完全吞没。他当然没听到。但他往她的方向看了一眼。只是无意识的、扫过人群的一眼。她站在那里，让他的目光穿过自己透明的、不存在的身体。她想：我在这里。我在。你不知道。但我一直在。 第三章：观看出道之后，他的生活被撕成了碎片。不是被挫折撕碎——是被行程、通告、舞台、镜头、合同、签名、飞行、时差撕碎。林知予的观测窗口跟着他飞了十几个城市，穿过无数个机场、酒店大堂、演播厅后台、保姆车后座。她看他每天只睡很少时间，在车上补觉，在化妆间吃饭。看他对着不同的镜头说差不多的话，对不同的记者保持差不多的微笑。看他在舞台上被万人欢呼，走下舞台之后一个人坐在休息室沙发上，不说话，只是坐着。有一次，在某个颁奖礼的后台，他的膝盖又不舒服了。她看到他坐在化妆间角落里，从包里摸出膏药。还是那个最便宜的牌子，几年了没换过。他撕包装的动作很熟练——用牙咬开一角，手指一扯，啪地贴在膝盖侧面。然后把裤腿放下来，站起来，对着镜子调整了一下表情。镜子里的人看起来精神饱满，没有任何破绽。他走出去，走上舞台，接过了年度最佳专辑的奖杯。林知予站在侧幕条的位置——她发现侧幕条是她最常待的地方。这里能看到台上的追光灯，也能看到台下的黑暗。能看到他举起奖杯时手指微微收紧的细节，也能看到他说完获奖感言转身下台时，追光灯熄灭的那一瞬间，肩膀塌下来的弧度。台上台下，两副身体。她开始注意到一些别人不太会注意的事情。比如他在嘈杂的媒体群访环节，会在回答问题之前先看一眼提问的记者，不管对方是哪家媒体、坐在第几排。比如他在红毯上被摄影师喊“看这边看这边”的时候，会尽量给每个方向的镜头都停一秒，让所有人都有照片可发。比如他在活动结束后离场时，会经过工作人员通道，对每一个站在通道边上的人——场务、保洁、安保——微微点一下头。不是刻意，是习惯。像是他脑子里有一张不写在脸上的清单：今天有多少人在为这场活动工作，他不能一一感谢，但他可以一一点头。林知予试着想象这种生活：被无数人注视，也要注视无数人。被期待、被要求、被解读、被消费。而他还在做一件事——在所有这些注视的间隙里，继续写歌。她看到他在飞机上写，在酒店房间里写，在凌晨回家的保姆车上写。他把手机备忘录打开，手指在屏幕上快速敲字，敲几行停下来，删掉一半，再敲。她站在他身后看那些歌词草稿——有些后来发表了，成了排行榜上的金曲；有些没发表，被他删了。她觉得那些删掉的更私人。有一句她记得很清楚，他在某个凌晨三点写下的：灯光是我的观众，一遍一遍，直到影子也学会跳舞。第二天她再看的时候，删了。她开始理解一些事情。关于他为什么在舞台上和舞台下判若两人。不是伪装——舞台上的他和台下的他是同一个人，只是被不同的光照着。聚光灯照出的是他极致专注的那个侧面，把他变成了所有人想象中的那个人。而台下的他，只是把聚光灯关掉了。关掉之后，他还是那个会在镜子角落给自己写“膝盖不舒服记得买膏药”的人。只是没人看到。她看了。她全看了。2021年冬天，他的个人巡演开始了。第一场在万人体育馆。林知予把自己的观测窗口悬在舞台正上方——不是侧幕条，不是后台，是正上方。她想从最好的角度看他。开场曲的前奏响起，他从升降台上缓缓升起，追光灯追着他，全场尖叫。他站在舞台中央，举起话筒。林知予在他正上方大概十米的位置。从这个角度看，舞台是一圈巨大的光晕，他就是光晕中心一个黑色的剪影。很小。但在动。在唱。她忽然想到一件事。四年前她第一次看到他——在这个时代的时间线里是四年前，在她自己的时间线里是更久——他在练习室地板上，坐在那里，膝盖上贴着膏药，仰头看着天花板。那时候他也是一个人。现在台下有几万个人，他在几万个人面前唱歌。但他还是一个人。不是孤独的那种一个人。是“有些事只能自己扛”的那种一个人。演唱会结束之后，他回到酒店。林知予跟着他进了房间——她的观测窗口可以穿过任何物理障碍，但她通常不会跟他进私人空间。 排练、会议、舞台调度里，在所有的灯光、编曲、延伸台长度的争论里，他一直在把自己往前推。用工作填满，用目标牵引，用“下一场”“下一首”“下一次”作为支点。现在这一轮巡演只剩下明天最后一场了。下一场之后，“下一次”会是什么？这个问题压在他身上，而她看得到它的重量。不是因为他想死——是因为他太累了，而“接下来”是一片他暂时看不到边际的空白。那不是绝望。那是某种比绝望更危险的、安静的、没有形状的疲惫。她想走过去。她想站在他身边，不是“身后两步”，是并排。她不能。她只能在两步之外，用自己也不确定能不能被感知到的存在，陪着他站在凌晨的城市微光里。她说：不要死。不是你在做，是别人在做。扛过去。他当然听不到。但他说了一句话。声音很轻，轻到她差点以为是窗外的风声。他说：“有人在吗。”不是对上帝说的，不是对神明说的。他的语气太平了，平得像在问“今天星期几”。像是他并不期待有回答。只是问一下。林知予站在他身后两步。她用他能听到的最大音量——不对，她没有音量。她用自己全部的意志力，用观测窗口能承载的所有情绪能量，用她在观测仓里真实的、有物理形态的喉咙，在2042年的实验室里，对着无尽的时空裂隙说出一个字：“在。”他没有任何反应。他当然没有反应。观测窗口不能传递任何信息。但他说完那句话之后，在窗前又站了一会儿，然后他的手指从窗台上松开了。不是垂下，是松开——那种攥了很久、终于允许自己放下来的松开。他把窗帘拉好，转身回到床边坐下。他拿起床头柜上的水杯，喝了一口。然后他说了一句更轻的话，轻到林知予几乎错过了——“明天做完最后一场。”她站在房间里，窗外的天开始泛蓝。她想：明天做完最后一场。然后呢？他没有说然后。但他睡了。他把被子拉到胸口，侧过身，闭上眼睛。呼吸慢慢均匀下来。林知予站在床边，看着他入睡。这是她第一次看他睡觉。他的眼睫毛在黑暗中微微颤动，眉心有一道很浅的纹路。他的手指还微微蜷着，是握话筒握了太久的惯性。他呼吸的时候，肩膀起伏的幅度很小，像是连睡眠都在控制着什么。她在心里说：晚安。明天见。她在黑暗里站了很久。然后窗外透进来第一道晨光。 第六章：最后一场最后一场演出定在晚上七点半。林知予从早上就开始觉得不对劲。不是预感——她不信预感。是她注意到了之前忽略的细节：他今天没有吃早饭。不是没时间吃，是送进房间的餐车原封不动地被推了出来。午餐他吃了两口，放下筷子，继续翻看下午彩排的流程单。下午彩排的时候，他的状态和平时没有任何区别。走位精准，定点干净，跟乐队沟通的时候语速平稳，甚至跟舞者开了两句玩笑。但林知予注意到他下台之后，在侧幕条的阴影里站了片刻，闭了闭眼。不是累——是某个更深的、她不敢确认的东西。她见过他在台上和台下的各种状态。2018年在练习室地板上一个人对着镜子死磕同一个动作，膝盖贴着膏药，站起来继续跳。2023年在消防通道里面对着一面白墙，手垂在身侧，呼吸很沉。那些时候她知道他在扛。扛着扛着就过去了。但今天不一样。今天他站在侧幕条阴影里闭眼的那短短几秒，林知予看到了一种她从未见过的神色——不是扛不动，是某种比扛更深的、像是已经做完了决定的东西。她的意识猛地收紧了。她想：他不是在准备上台。他是在收尾。晚上七点半，全场灯光暗下来。开场曲的前奏响起，他从升降台上升起。追光灯追着他，全场尖叫声震得穹顶都在发颤。林知予站在侧幕条——那个她最熟悉的位置。从这里能看到他的正面、侧面、背影，能看到追光灯在他肩膀上烧出的轮廓线，能看到他额角的汗珠在第二首歌的副歌段落开始沁出。他今天的舞台没有瑕疵。不是“表现正常”——比正常更强。他的动作比平时更用力，高音比平时更稳，延伸台他跑了三趟，每一次都跑到最远端，蹲下来跟看台区的观众对视。他像是在用身体记住每一个动作的反馈——地板的反弹力，灯光的温度，观众席涌上来的声浪拍在脸上的感觉。第三首歌结束的时候，他在舞台中央站定，等追光灯收拢到他一个人身上。他对着全场说了一句话，声音有点喘，但很稳：“今天是我的最后一场巡演。谢谢大家来。”观众席爆发出尖叫和掌声，灯牌在黑暗中起伏成一片光的海。林知予站在侧幕条后面，手指攥着虚无——她在目标时代没有手指，但她在观测仓里的手正死死抓着扶手。她听出了那句话里的时态。不是“本轮巡演的最后一场”，是“我的最后一场”。他把“本轮”去掉了。全场只有她一个人听出了这个区别。演出继续。安可曲是《情人》。他在前奏响起之前，走到舞台最前端，蹲下来，把耳返摘掉。全场灯光暗到只剩一束追光。他开始清唱。不是用技巧——是用几乎像在跟谁说话的音量。万人的体育馆安静到能听到自己的心跳，他的声音没有任何修饰地穿过穹顶。林知予站在侧幕条后面，跟着他无声地唱完了整首歌。每一个字她都会，每一个转音她都熟。她想起很久以前——在2042年的时间线里是很久以前，在他的人生里是第一次巡演——她站在另一个侧幕条后面，也这样无声地跟着他唱。那时候他的耳返掉了，是她不能递的备用耳返。那时候他想说什么，又没说。那时候她觉得自己可以这样一直看下去，看到他老，看到他唱不动。安可结束。灯光暗下去。他退场。林知予跟着他穿过走廊，穿过后台，穿过所有来祝贺的工作人员和还没卸妆的舞者。他微笑着跟所有人说辛苦了，说谢谢，跟乐队总监击掌，跟经纪人确认明天不用早起。一切都正常。太正常了。正常到林知予的每一根神经都在尖叫。他回到酒店，关上门。没有开灯。他坐在床边，把演出服的外套脱下来搭在椅背上。然后他坐在那里，两只手放在膝盖上。他没有哭，没有颤抖，没有做任何戏剧化的动作。他只是坐在那里，呼吸平稳，表情平静。然后他说了一句话。声音很轻，像是在对自己说，又像是在对一个他不确定存在不存在的人说：“做完了。”林知予站在他面前。她看着他的脸——这张她看了无数年的脸。她看到过他十四岁在历史课本上的舞台照，金色亮片从头顶飘下来。她看到过他第一次在练习室地板上坐着，膝盖贴着膏药，仰头看着天花板。她看到过他在消防通道里面对一面白墙，看到过他在便利店门口删掉自己写的“今天录完了。膝盖还好。明天还有一场”。她看到过他站在凌晨窗边说“有人在吗”。现在他坐在这里，表情平静，说“做完了”。不是“做到了”，是“做完了”。像是做完了一件一直在撑的事，现在可以不用撑了。然后他站起来，走向窗户。林知予的整个世界在那一刻塌缩成了这一个动作。她不能拉住他。她不能挡在窗前。她不能喊“不要”。她的观测窗口是纯视觉和听觉的——没有物理形态，没有交互能力，没有任何办法阻止任何事。但她可以站在他面前。她可以站在他和窗户之间。他看不见她——观测窗口对目标时代完全不可见。但她还是站过去了。她站在他和那扇窗户之间，正对着他的脸。她用自己的脸，对着他的眼睛——那双正在看向某个她不敢确认的方向的眼睛。她用尽观测仓里真实身体的所有力气，用尽她在这个时代积累了无数年的所有无声，用尽她作为一个人能调动的全部意志，说了一个字：“在。”她没有声音。观测窗口不能传递任何信息。但她说出了这个字。对着他的眼睛，对着他那句“有人在吗”——她等了太久才给出的回答。他已经问过了。在那个凌晨的窗边，在无人应答的城市微光里，他问过。她没有能力回答。但现在她回答了。哪怕他还是听不到，她也要站在他面前，把这个字说出来。他站在窗前。他站了很久。然后他低下头，看着自己的手。那只手刚才还在舞台上拿着话筒，被万人注视。现在它在微微颤抖——不是累，是别的什么。他把手翻过来，看着掌心。然后他退后了一步。只是一步。很小的一步，从窗户到床边的一步。他退回床边，坐下来，两只手重新放在膝盖上。窗外的城市还在沉睡，霓虹灯的光透过窗帘缝隙落在他的光脚背上。他坐在那里，低着头，肩膀没有抖，但林知予能看到他的呼吸在变——从平稳的、可控的、被压得很慢的呼吸，变成某种更深的、带着胸腔起伏的长长的换气。像是一个潜水太久的人，第一次浮出水面。他坐了很长时间。然后他伸手拿起床头柜上的水杯，喝了一口。他的手还在微微发抖，但他在喝水。林知予站在原地，看着他咽下那口水。她的膝盖——在2042年观测仓里真实存在的膝盖——几乎撑不住她。她刚才没有想任何事。没有想穿越规则，没有想观测协议，没有想“如果”。她只是站过去了。现在她在发抖。他放下水杯。他说：“有人在。”不是问句。不是对着虚空发问。是陈述句。他对着空无一人的房间——至少在他的感知里是空无一人的房间——说了一句陈述句。像是在确认。像是一个人终于捕捉到了一个他一直隐约感觉到的信号，信号很微弱，微弱到无法被任何仪器测量，但他在这个凌晨决定相信它。他躺回床上，把被子拉到胸口。他没有马上闭眼。他睁着眼睛，看着天花板。林知予站在他的床边。她的观测窗口正在变得不稳定——不是他引起的，是装置的问题。在2042年的实验室里，持续运行了几年的投射装置正在达到极限。她能感觉到自己的意识在目标时代和本体之间被拉扯，观测窗口的画面偶尔会出现细微的撕裂。她知道自己快被拉回去了。她站在他的床边。他看着天花板。窗外，天开始亮了。不是那种骤然的日出——是那种缓慢的、从深蓝到淡蓝的过渡。第一缕晨光从窗帘缝隙里渗进来，落在被子上，落在他放在被子上的那只手上。他闭上了眼睛。呼吸平稳，眉心那道很浅的纹路松开了。林知予看着他入睡。他的睫毛在晨光里投下很淡的阴影，手指还微微蜷着，是被话筒和笔和无数个凌晨打磨过的形状。她想起所有事。想起练习室镜子角落里那行字：膝盖不舒服，记得买膏药。想起纸杯上的笑脸。想起消防通道里的白墙。想起他在凌晨窗边说“有人在吗”。想起他刚才退后的一步。她说：“天亮了。”观测窗口撕裂了最后一帧画面。他的脸在晨光里——平静的、睡着的。然后一切被切断。林知予在观测仓里睁开眼睛。实验室的日光灯刺得她眼眶发酸。她的脸上全是湿的——她不知道自己在仓里哭了多久。她慢慢坐起来，把神经接口从太阳穴上摘下来。手指在发抖。膝盖在发抖。整个人像被抽走了所有力气。屏幕上的数据显示投射装置已自动关闭，运行时长超标。她盯着那个数字，没有反应。她不关心运行时长，不关心装置，不关心任何数据。她只想确认一件事——他活下来了。她不知道他接下来会做什么，不知道他会不会再走到那扇窗户前面，不知道退后一步是暂时的还是永久的。但她知道这一刻他睡着了。天亮了。他活过了这一夜。第七章：漫长的回音林知予在观测仓里坐了很长时间。实验室的日光灯嗡嗡响，屏幕上的数据还在跳动——投射装置运行时长超标，自动关闭已触发，观测记录按协议清除。她盯着那行字看了很久。观测记录已清除。她在目标时代待了多久？按那个时代的时间流速算，好几年。这几年她看到的每一个画面、每一段声音、每一次他对着镜子皱眉、每一次他在消防通道里沉默、每一次他在凌晨窗边说那些轻到几乎听不见的话——全部清零。她慢慢把神经接口从太阳穴上摘下来，手指还在发抖。不是观测仓的副作用，是她的身体还没从刚才那一刻缓过来。她站在他和窗户之间，用自己的脸对着他的眼睛，说“在”。然后他退后了一步。她不知道是巧合还是他真的感知到了什么。观测窗口不能传递信息，这是物理定律。但他在那一步之后说了“有人在”。不是问句。是陈述句。她不想用科学解释这句话。她只想记住它。她从观测仓里出来，赤脚踩在实验室冰凉的复合地板上。窗外是2042年的夜空——她离开的时候是下午，现在已经是深夜。她扶着观测仓的边缘站了一会儿，腿还是软的。她需要写点什么，在记忆完全消退之前。她走到工作台前，打开全息屏幕。屏幕亮起来，光标在空白文档上闪烁。她把手指放在虚拟键盘上。然后她发现自己什么都写不出来。不是忘了。是太多了。他第一次在练习室地板上坐着仰头看天花板的样子。他把膏药贴在膝盖上的动作。他在镜子上用白板笔写“膝盖不舒服记得买膏药”。他在消防通道里面对一面白墙。他在凌晨窗边说“有人在吗”。他在便利店门口删掉自己写的“今天录完了膝盖还好明天还有一场”。他在最后一场演出结束之后坐在床边说“做完了”。然后他站起来，走向窗户。然后他退后一步。太多画面同时涌上来，她的手指悬在键盘上方，无法按下任何一个键。她忽然意识到一件事：这些记忆不会被保留。装置保护机制会自动清除持续观测的具体内容，这是为了保护观测者心理健康设定的行业标准。她签过协议的。她同意了的。在穿越之前她觉得这条规定很合理——一个观测者如果在目标时代目击大量无法改变的痛苦，带着全部细节回来，会承受难以消化的心理负担。但此刻她坐在这里，看着空白文档，觉得当初签字的自己简直不可理喻。她不想被保护。她想记住。但规则不是她能改的。清除过程已经开始——她能感觉到某些画面正在变模糊。不是完全消失，是像一张浸了水的画，边缘正在慢慢洇开。他的脸还是清晰的，但他的声音——他在凌晨窗边说“有人在吗”的那个语气——正在变远。她用力回想，但越用力，那个音色越模糊。像用手去捞水，水从指缝里流走。她在工作台前坐了很久。然后她在文档里写了两句话。没有情节，没有细节，没有任何能被归档为观测记录的东西。她写：他活下来了。他在天亮的时候睡着了。第二天，她去找周教授汇报。周教授坐在办公桌后面，听她说完投射装置超时运行的事情——她承认自己违反了操作流程，没有在标准时长内关闭装置，愿意接受任何处分。周教授沉默了一会儿。他不是那种会发火的导师，他只是摘下眼镜擦了擦，又戴上。“观测数据呢？”“按协议自动清除了。”林知予说。她的语气很平稳，像是在陈述一个与自己无关的事实。周教授看着她。他的目光从她眼底扫过去，没有追问。他只是说：“你的观测资格暂停一个月。回去休息。”林知予点头，站起来，走到门口。“林知予。”她回头。周教授没有看她，在看手里的文件。“有些东西，数据记不住也没关系，”他说，“身体会记住。”林知予站在门口。她想说“谢谢”，但喉咙像被什么东西堵住了。她只是点了点头，轻轻带上门。接下来的日子比她预想的更难熬。不是情绪低落——是某种更深的、没有形状的空。观测记录的清除在持续进行。她每天醒来都会发现有些画面比昨天更模糊了一点。他唱《情人》时最后一个转音的音高。他吃盒饭时把青椒挑到盖子角落的顺序。他写歌词时咬笔头的习惯——他咬的是笔尾还是笔帽？她记不清了。这种遗忘不是突然的删除，是缓慢的、温柔的、像沙子从指缝里漏掉的感觉。她越想去抓，漏得越快。一个月之后，她已经记不清他在决赛夜穿的演出服是什么颜色。她只记得金色亮片从头顶飘下来，他站在光里。但她的身体开始出现一些奇怪的反应。有一天她在图书馆翻资料，耳机里随机播放到一段旋律——她不确定是谁的歌，但副歌响起的瞬间她停住了。胸口突然收紧，心跳快了半拍，眼眶没有理由地发酸。她不知道这首歌是什么，不知道它的名字，不知道演唱者是谁。但她站在原地，手按着胸口，直到整首歌放完。她对自己说：只是旋律好听。但她的身体知道不是。身体还记得。周教授说得对——数据记不住，身体会记住。又过了一段时间。她开始能正常吃饭、睡觉、做课题。她把观测仓的使用申请换成了理论方向——不再申请投射，改做历史文献分析。导师以为她是想换个安全的方向。她没有解释。她知道如果再次启动投射，她会忍不住做同样的事。而这一次，她的观测资格不会再被暂停——会被永久注销。她不能失去观测仓。哪怕是理论方向，哪怕是隔着几十年的文献和二手资料，她需要某种和他保持联结的方式。哪怕这个联结只是坐在同一个研究所的同一栋楼里，用同一套设备的不同功能。很久以后。她在整理新一批观测档案的时候，无意间翻到了一本更新的历史教科书。她翻到那一页——那个她十四岁看过无数遍的章节。标题不再是“本世纪初文化悲剧案例第7号”。而是《逆袭：他从全网嘲讽中走来，成为时代的声音》。配图也不再是那张“最后一场演出”的照片。取而代之的是他更晚一些的纪念演出——同样的金色亮片，同样的追光灯。他站在舞台中央，头发已经有些白了，但眼睛还是那双眼睛。她往下翻。在脚注里，有一行很小的字：“其职业生涯中，曾多次在采访中提及‘某个阶段感到一种没有来源的笃定’。研究者对此现象无一致解释。”林知予盯着那行字看了很久。没有来源的笃定。他感觉到了，但他不知道来源是什么。不知道有人站在侧幕条后面，站在消防通道里，站在凌晨的窗边，站在他和窗户之间。不知道有人在他说“有人在吗”的时候回答了他。这样很好。她不在乎来源有没有解释，不在乎研究者有没有答案。她只在乎一件事——他感觉到了。他活下来了。她把书合上，轻轻放回书架。窗外是2042年的天空，蓝得很干净。她站在那里，手还搭在书脊上。有些东西，数据记不住。身体记住了。她把书推回原位，无声地说了两个字。不是“再见”——她没办法对一个她不记得的人说再见。但她知道自己生命里有一段空白，那段空白的形状是一个人的轮廓。他做过的一切，他扛过的所有事，他说过的和没说过的话。她不记得了，但她的身体留着一个空位，那个空位刚好是他。 第八章：没有来源的笃定林知予把历史教科书放回书架之后，在档案室窗前站了很久。窗外是2042年的天空。飞行器在高楼之间穿行，全息广告牌在远处闪烁，街上的人穿着剪裁利落的合成纤维外套，步履匆匆。和她离开观测仓那天看到的夜景没什么不同。和她十四岁第一次翻开历史课本那天也没什么不同。世界还是那个世界。但她知道了一些事。不是记得——是知道。知道自己在某个时间段里做了一件很重要的事，虽然她现在已经说不上来那件事具体是什么。知道有一个人，因为她——不对，不是因为她，是因为他自己——活下来了。她后来再也没有申请过投射。观测资格在暂停期满之后自动恢复，研究所的系统给她发了通知，她看了一眼，关掉了。不是不想回去。是没必要了。她要做的事已经做完了。或者说，她做不了任何事——她从来就做不了任何事。她只是站在那里，看着。而“看着”本身，竟然也是有重量的。这是她花了很多年才学会的东西。她把精力转向了另一个方向。不是历史文献分析——她换了课题。新课题是“长期单向观测对观测者心理状态的影响”，研究对象不是过去的人，是和她一样的观测者。那些坐在投射装置里、在目标时代没有身体、不能触碰任何事物、只能看的人。她想弄清楚那种无力感——那种目击一切却无法干预的沉重——是怎么被消化、被转化、被安放的。或者，有没有可能，它根本不需要被消化。有没有可能，这种沉重本身，就是观测的意义。她的导师周教授在这期间退休了。退休之前，他把她叫到办公室，递给她一份推荐信。推荐她留所任教，研究方向自选。林知予接过推荐信，手指微微收紧。“你几年前从观测仓里出来的时候，”周教授说，语气还是那么平，“我问你观测数据呢，你说清除了。我当时就知道你没有说真话。不是数据清除了——是你不想说。”林知予没有说话。“你不用告诉我你看到了什么，”周教授站起来，把书架上的几本书码整齐，“但如果你以后带学生，记住一件事——观测者的心理健康有一半靠的不是清除记忆，是有人可以不说。”林知予站在那里。几年前——在目标时代的时间线里是很多很多年前——她站在一扇窗户面前，用自己的脸对着一个人的眼睛，说了一个他听不到的字。当时她以为那个字永远不会被任何人听到了。但周教授听到了。不是那个字本身——是她在观测仓里睁开眼睛的时候，脸上没擦干净的泪痕。“我知道了。”她说。留所之后，她带了一届又一届学生。有学生对时空观测充满热情，写申请书的时候用了一堆惊叹号；有学生把她当成学术偶像，在课堂上追问她“观测者的自我修养到底是什么”。她站在讲台上，看着那些年轻的、跃跃欲试的脸，想起自己当初在申请表上写“课题方向为早期网络亚文化中的公众情绪传播”的样子。她没有告诉他们自己真正观测过什么。她只是教他们校准参数、设定坐标、遵守伦理边界。然后她会多讲一句——不在教案里、不在考试范围里、不在任何学术规范里的那句话。“如果你们在观测中目击了无法改变的事，”她说，“回来之后，找个人说说。不一定要说具体内容——如果记忆清除了就说不出具体内容了。但你可以说‘我很重’。找个人听。这是观测者自我保护的最后一环，不是协议里写的那环。”学生们低头记笔记。她不知道他们有没有听懂。她希望他们永远不用听懂，但也知道这不可能。几年后，2042年秋天。林知予在研究所的走廊上被一个新来的实习生拦住了。实习生手里捧着一块数据板，脸上带着那种刚入职才有的紧张和兴奋，说话有点结巴。“林老师，那个——您的观测笔记编号LX-1077——系统显示状态是已归档，但有几行文字数据被保留了，不是影像，不是音频，就是几行字。我没看懂——是观测结论吗？”林知予接过数据板。屏幕上是她的观测档案，状态栏写着“已终结”，数据留存栏写着“影像数据：无。音频数据：无。文字备注：两行。”下面是她很久以前从观测仓里出来那天晚上，在记忆被完全清除之前，用发抖的手指在空白文档上敲下的那两句话——“他活下来了。”“他在天亮的时候睡着了。”她盯着那两行字看了很久。她不记得自己写过。她不记得那个“他”是谁，不记得“天亮”是哪一天的几点几分，不记得那个人睡着的时候睫毛在晨光里投下的阴影是什么形状。但她记得一种感觉。很轻，像是站在很远的地方看了一场烟花，烟花的形状已经忘了，但还记得它照亮夜空时，胸口那一瞬间的暖意。“不是观测结论，”她把数据板还给实习生，“只是备忘。”实习生一脸困惑地走了。林知予站在走廊上，看着窗外2042年的天空。多年前——在目标时代的时间线里是更久以前——她站在另一个凌晨的窗边，用观测窗口正在撕裂的视线，看着一个人闭上眼睛。当时她不知道自己还会不会回来。不知道装置会不会在下一秒彻底断电。不知道她对他说的那句无声的“天亮了”有没有被任何东西接收到。现在她知道了。他活下来了。他在天亮的时候睡着了。后来他醒了。后来他做完了所有他说过要做和没说过要做的事。他在采访里提到过“某个阶段感到一种没有来源的笃定”。研究者对此没有一致解释。她也没有。但她不需要解释。那天晚上，林知予下班之后没有直接回家。她走到研究所外面的小广场上，坐在长椅上，戴上耳机。音乐播放器随机跳到了一首歌。前奏响起来的瞬间，她的手指停住了。是一首老歌。非常老了——在这个时代，任何来自二十一世纪初的声音都算老歌。旋律很简单，几个和弦反复来回。她没有听过这首歌。她确定自己没听过。但她听到副歌的时候，胸口突然收紧，心跳快了半拍，眼眶没有理由地发酸。和几年前在图书馆里那次一模一样。她坐在长椅上，把歌听完了。她不知道这首歌叫什么名字，不知道它的创作者是谁，不知道它和自己被清除的那段记忆有什么关系。但她听到了最后一句歌词。不是歌词——是一个放在歌曲最末尾的、没有被写进歌词页的声音。很小，像是录音结束之后，有人在录音室里无意中说了一句话。那个声音很轻，轻到如果不把音量调到最大、如果不是在安静的夜晚独自听、如果不是有人在茫茫的随机歌单里恰好跳到这一首——根本不会注意到。那个声音说：“谢谢。”林知予坐在长椅上，耳机里是歌曲结束后的空白底噪。她慢慢把耳机摘下来，手指按在膝盖上。她的膝盖没有抖。她只是坐在那里，在2042年秋天的晚风里，安静地笑了。不记得了。但身体还记得。 第九章：侧幕条之后多年以后，2042年深秋。时空社会学研究所。林知予在档案室里翻一份旧文件。研究所即将搬迁，所有纸质档案需要在年底前完成数字化归档。她主动申请了这份额外工作——不是闲，是她喜欢档案室。这里安静，恒温恒湿，空气里有旧纸和干燥剂的混合气味，像是被遗忘的时间本身散发的气息。她在整理一批早期观测项目的注销文件时，翻到了一个熟悉的编号：LX-1077。她的第一个观测项目。档案袋很薄——影像数据无，音频数据无，观测日志仅存两行文字。她看着那两行字，和过去每次看到时一样，产生了一种轻微的、无法定位的熟悉感。“他活下来了。”“他在天亮的时候睡着了。”她不记得自己写这两句话时的状态。记录显示项目因装置超时运行自动终止，观测者在标准时长内未按规定关闭投射，观测资格后被暂停。档案里没有写她为什么没有按时关闭装置。她自己也说不清楚。每次有人问起这个编号——偶尔有学生翻旧档案时会好奇问一句——她都只是说，观测笔记编号LX-1077，观测目标是个体案例研究，数据按协议清除了。然后她会把档案袋放回架子上，继续做下一件事。但今天她放回去之后没有马上走。她站在档案架前，手指还搭在文件袋的纸边上。窗外的天空正在转暗，远处有几栋楼的灯已经亮起来了。她在这个研究所待了很久。从研究生到留所任教，从项目组成员到带学生做课题。她写过很多论文，做过很多观测，指导过很多试图穿越时空的学生。但没有一个项目，让她在档案室里站到天黑还不想走。她把档案袋重新抽出来，翻开。那两行字被打印在标准格式的观测日志模板上，字体是统一的黑体，排列在“备注”一栏里，像任何一份正经报告的最后一行补充说明。但她总觉得它们不该是冷冰冰的印刷体。它们应该是手写的，潦草的，带着刚从观测仓里出来时手指发抖的笔迹。她把档案袋放回去，推上档案架的滑轨。金属滑轨发出沉闷的响声。然后她听到了音乐。不是从档案室里传出来的。是从楼下——研究所一楼的公共休息区，有人在放一首很老的歌。旋律穿过楼板传上来，已经很微弱了，像是隔着一层水。林知予的手在档案架滑轨的把手上顿住了。是一首非常非常老的歌。和弦进行很熟悉——她确定自己没有听过这首歌，但她的身体不这么觉得。胸口收紧，心跳快了半拍，手指尖开始微微发麻。她站在原地，没有走动。音乐还在放。副歌部分结束了，进入间奏。间奏的编曲很简单——一架电子琴，几个和弦来回反复。像是某个人在某个深夜，坐在练习室的地板上，用最旧的那台琴随手弹出来的。她忽然觉得眼眶发酸，没有理由。她对自己说：只是旋律好听。但她的身体在那一刻比她诚实得多。身体记得那些已经被清除的画面——不是影像，是影像被抽走之后留在感官里的轮廓。像一本被撕掉所有照片的相册，照片没了，但每页纸上还留着照片边缘压出的凹痕。歌曲放到了尾声。最后一个音符落下之后，有几秒钟的空白。不是静音——是录音还在继续的空白，底噪很轻，能听到录音室里空调的低频嗡鸣。然后，在所有人都以为这首歌已经结束的时候，从很遥远的地方传来一个极轻的声音，像是不小心被收进母带的、本来不该留下来的尾音。那个声音说：“谢谢。”林知予站在档案架之间的窄道里。窗外全黑了。研究所一楼休息区的音乐不知道什么时候停了。她的手指还搭在滑轨把手上。她把那只手收回来，低头看着自己的手指。手指没有抖。但她的眼眶是湿的。她不知道自己为什么哭。只是觉得好像有一个声音在说谢谢。而她已经等了这个声音等了好多年。后来，2030年代。体育馆。他已经不年轻了。头发白了一半，嗓音比以前沙了一点，膝盖做过一次手术之后走路时会微微偏一下重心。但他还站在舞台上。不是巡演，是纪念演出——纪念某张专辑发行多少周年，纪念某个人，纪念某个连他自己也说不清楚是从什么时候开始改变的时刻。他在唱最后一首歌之前，对着满场观众说了一段话。他说：“很多年前，有一个晚上，我觉得自己已经把能做的事情都做完了。然后我听到一个声音——不是真的听到，是感觉到。感觉到有人在。后来我每次站上舞台，都会想起那个晚上。我不确定那个人是谁，不确定那个声音是我的幻觉还是别的什么。但我确定一件事。我在这个舞台上站到今天，有一部分原因，是因为那个我不知道是谁的人。所以这首歌——每次唱到这里我都会说谢谢。今天也一样。”音乐响起。是那首他写过无数遍、改过无数遍、在无数个凌晨的录音室里反复磨过的歌。曲目表上它的名字是一个编号，没有人知道那个编号代表什么。但每次唱到这首歌的时候，他都会在最后一个音符落下之后，对着话筒轻轻说一声谢谢。林知予在档案室。她不知道他说了这些话。她不知道同一天晚上，在距离她几十公里之外的体育馆里，一万人在合唱一首她从未听过的歌。她只是站在档案架前，手里捏着一张从资料库打印出来的照片。照片是她在整理旧档案时无意间翻到的，配图用的，不是观测记录的一部分。照片上是某场演出的舞台侧幕条，一群工作人员站在那里。角落里有一个空位——不是真的空位，只是那个位置没有人站在焦点里。但她看着那个空位的时候，有一种很奇怪的感觉，好像自己曾经在那里站过。站了很久。 第十章：他之所见2025年春天，北京。他在巡演间隙回了趟旧公寓，打算清理一些很早之前放在那的东西。公寓是出道第三年租的，后来行程越来越多，他很少回来住，但一直没退租。房东催了几次让他把东西搬走，他拖了大半年，终于找了一个没有通告的周末回来收拾。东西不多。几箱衣服，一些早期的奖杯和纪念品，一摞旧杂志。墙角堆着几个纸箱，是之前公司搬办公室的时候打包送过来的，封着胶带，箱子上用马克笔写着年份。2018，2019，2020。他用钥匙划开标着2018的那个箱子。里面是一些早期的通告资料、工作证、后台合影。大部分都是看过的，他把它们分类放好，准备交给公司存档。翻到箱底的时候，他的手停住了。那是一张决赛夜的后台照片。舞台上的金色亮片还在飘，一群工作人员站在侧幕条旁边，有人比着大拇指，有人红着眼眶。角落里有一个位置很暗，不是空的，但也没有任何人站在焦点里。只是侧幕条边缘的一小片阴影，被舞台漏过来的光切出一个模糊的轮廓。他盯着那个角落看了很久。不是在看某个人——那里没有人。只是那片阴影的形状让他觉得熟悉。像是很多年前，他站在侧幕条旁边等待上台的时候，总觉得那个方向有什么东西在。不是视线，不是被人盯着看的感觉。是一种更轻的、像是空气在那个位置微微变暖了一度的存在感。他从来没有跟任何人提过。说了也没人信。他把照片翻过来，背面什么也没写。又继续翻。另一张——出道发布会，场馆入口，人群边缘有一小片空位。再一张——颁奖礼，工作人员通道，角落里没有聚焦的阴影。不同年份，不同活动，不同场馆，但每张照片的侧幕条附近都有那个若有若无的空白。不是同一个人。不是任何东西。只是他每次看到侧幕条的时候，都会下意识地往那个方向多看一眼。好像那里应该有什么。他把这些照片在面前一字排开，坐在地板上看了很久。然后他站起来，走到窗前。窗外的北京正在入夜，立交桥上的车流连成一条光的河。他忽然想起决赛夜。他站在舞台中央，聚光灯太亮，看不清台下任何一张脸。但他往侧幕条方向看了一眼。他当时不知道自己为什么要往那边看——可能是因为那边站着工作人员，可能是因为那边的灯光暗一些，对他的眼睛来说是一个休息。但现在他坐在这里，面前摊着这么多张照片，他忽然不确定了。也许不是因为灯光暗。那天晚上他没有继续收拾东西。他坐在纸箱旁边，开始回想。回想那些他从来没有认真串联过的片段。决赛夜，他说“谢谢在这段时间里给过我水的人”——那句话是对谁说的？他不知道。但他说的时候，是往侧幕条方向看的。第一场个人演唱会，他的耳返掉了，备用耳返被递到手里——是谁递的？他不记得了。但他记得那天晚上，在后台通道里，他感觉到一阵很奇怪的东西，像是有人在身边，很近，但不是物理意义上的近。2023年谣言风波，他在消防通道里面对一面白墙。他当时觉得自己扛不住了。不是比喻——是真的扛不住了，身体和意志同时触底。但他站在那面墙前面的时候，忽然觉得背后有一点暖意。不是温度，是某种极其微弱的、像是有人在身后的感觉。他回头，什么都没有。他当时以为那是幻觉。后来他在酒店房间里，凌晨，站在窗前，问了一句“有人在吗”。不是对任何人说的。但问完之后他感觉到什么——不是回答，不是声音，不是任何可以被五官捕捉的信号。只是一个感觉：在。有人。他退后了一步。不是因为听到了什么，是因为那个“在”的感觉太确切了。确切到他无法用任何理性解释，也无法忽略。他活下来了。不是因为那个感觉——是因为他自己。但那个感觉让他知道自己不是一个人。而他花了太久才承认，他需要知道这件事。他坐在地板上，把这些年散落的碎片一块一块拼起来。不是推理，不是分析，是某种更接近直觉的确认。有一个东西——不是人，不是鬼，不是任何他能用语言定义的存在——曾经在这里。在他最难的那些时刻，在侧幕条旁边，在消防通道里，在凌晨的窗边。不是在帮他，不是在救他。只是在。而“在”本身，就是他最需要的东西。他把照片收进随身的包里。没有交给公司存档。那天深夜，他坐在工作室里，打开了一个空白的文档。光标在屏幕上一闪一闪。他写了三句话：“在无人的练习室，灯光是唯一的观众。一遍一遍，直到影子也学会跳舞。那时候我觉得我是一个人。现在我知道我不是。有些东西不会留下痕迹，但会在时间里留下温度。谢谢。”他把这三句话放在新专辑的最后一页。不是歌词，不是文案，是单独印在最后一页上的、没有任何解释的文字。专辑的名字他想了很久，最后定了两个字——《回响》。 第十一章：记忆的形状2042年，时空社会学研究所，档案室。林知予在整理最后一批待归档的文件时，翻到了一张配图照片。照片是资料库的打印件，不是观测记录的一部分，被夹在一份早期项目注销文件里。不知道是谁放的，什么时候放的。照片上是一场演唱会的侧幕条，工作人员站在阴影里，舞台的光从侧面漏过来，在角落里切出一片明暗交界。她看着那片阴影里的空位，产生了一种奇怪的感觉。好像她曾经在那里站过。不是身体——是她整个存在。站在那里，看着台上的人，看他唱歌，看他鞠躬，看他下台时在侧幕条阴影里闭眼的那一瞬。她不记得那个人的脸，不记得那首歌的名字，不记得是哪一年哪一场演出。但她记得一个动作——他下台的时候，每次都会往侧幕条方向看一眼。不是看工作人员，不是看设备。是看那片阴影。好像那里有什么值得他看的东西。林知予把照片放回文件袋里，手在纸袋边缘停了一下。她的研究员习惯让她注意到这件事不合逻辑：她怎么可能记得一个人往侧幕条方向看了一眼？观测记录早就清除了。但她就是记得。不是情节，不是画面，不是任何能被写进观测日志的东西。是某种更细小的、更身体的记忆——一个人往你站的地方看了一眼，你不知道他看的是你，但你的身体记住了那个目光的角度。她把档案袋封好，贴上标签，放进待归档的箱子里。窗外已经是傍晚，研究所里的人走得差不多了。她坐在档案室的椅子上，没有马上离开。她忽然想起很多年前——在研究所的时间线里是几年前，在目标时代的时间线里是更久以前——她从观测仓里出来，坐在工作台前，手指发抖，在空白文档上写了两句话。她不记得写的是什么了。但她记得写完之后她趴在桌上哭了很久。不是因为难过。是因为太重了。而那些重量，她现在还背着。不是负担。是某种比负担更珍贵的东西。她不知道自己背的是什么，但她知道它很重要。重要到哪怕记忆全部清除了，身体还是会替她记着。她站起来，把档案室的灯关了。走到门口的时候，她回头看了一眼。窗外的城市灯光透过玻璃照进来，在档案架的金属把手上镀了一层淡金色。那个颜色让她想起了什么。她不记得了。但她知道那是某个很重要的东西的颜色。金色亮片的颜色。追光灯的颜色。练习室凌晨日光灯的颜色。她带上门，走廊里很安静。她忽然听到一首歌。不是从外面传来的——是从走廊尽头的休息区，有人在放音乐。她站在原地，听了几秒。旋律很陌生，但和弦进行让她停住了。那几个和弦来回反复，像某个人在某个深夜，坐在练习室的地板上，用最旧的那台琴随手弹的。她听过这首曲子。她确定自己听过。在某个她已经不记得的时间，在某个她还记得温度的空间。歌曲放完，最后一个音符落下。然后是几秒钟的空白底噪。然后一个声音说：“谢谢。”林知予站在走廊中央。走廊很长，灯光是冷白色的。她的影子落在灰色地板上。她慢慢抬起手，按在自己胸口——心跳很快，眼眶发酸。她不记得那首歌的名字了，不记得那个声音是谁的，不记得“谢谢”是对谁说的。但她忽然觉得，有一个人，在很远很远的地方，用了很长很长的时间，终于把这句话说出来了。而她已经等这句话等了太久太久。久到她忘了自己在等。但她还在等。而它终于到了。她在走廊里站了一会儿，然后继续往前走。走到休息区，没有人——音乐是某个实习生走之前忘记关的播放器，屏幕还亮着。她走过去，看了一眼屏幕上显示的歌名。两个字——《回响》。她把播放器关了，屏幕暗下去。她没有走。她站在那里，对着已经暗掉的屏幕，无声地说了两个字。不是“谢谢”，不是“再见”。是“我听到了”。不知道对谁说的。但她说的时候，胸口那个背了太久太久的重量，轻轻地松了一下。不记得了。但身体还记得。身体还记得那个目光的角度，那个凌晨的温度，那声谢谢的重量。这就够了。 终章：观测者2030年代末，体育馆。他又在唱那首歌了。头发全白了，嗓音比以前沙哑，膝盖做过第二次手术，上台之前需要在后台做比年轻时多一倍的热身。但他还在唱。这首歌的编曲改过很多版——年轻时追求极致，每次巡演都重新编曲；现在他只留一把吉他和一架旧电子琴，电子琴有几个键按下去会发出轻微的杂音，和多年前练习室角落里那台很像。前奏响起时全场安静。万人体育馆，没有人举灯牌——不是不让举，是这首歌的惯例。第一次唱它的时候有人在台下喊了句什么，他说“这首歌不要灯牌，让它安静”。此后每一场都不需要再提醒。他唱到副歌时声音有些吃力——气息不如从前了，但他把拍子拉长，用更慢的速度唱。像在做一件做了无数遍已经不需要想的事。间奏时他停下来，低头看自己的手。手背上有了老年斑，关节微微变形，是被话筒和笔和无数个凌晨打磨过的形状。他把手翻过来看着掌心——多年前某个凌晨，他站在酒店窗前，这只手在发抖，他低头看它，然后退后一步。现在它不再抖了。但每次唱到这里，他还是会看它一眼。全场屏息。间奏的最后一个音符落下，他把话筒靠近嘴唇。没有唱歌词，只是对着话筒轻轻说：“谢谢。”多年以后，时空社会学研究所。林知予退休那天，研究所给她办了一个简单的仪式。学生送了花，同事送了全息相册，相册里是她从入职到退休的每一届学生的合影。她在致辞时说了几句话，很短：“观测者的工作就是看。有些东西看完了就忘了，有些东西忘了还会留在身体里。你们如果以后在观测中目击了无法改变的事，回来之后，不要急着写报告。先坐一会儿。让身体记住那些数据记不住的东西。”傍晚她收拾办公室，把书架上的书一本一本装箱。翻到一本旧教材，书页已经发黄，是多年前用过的那版历史教科书。她翻开目录，找到那一章——标题是《逆袭：他从全网嘲讽中走来，成为时代的声音》。她盯着标题看了很久。她不记得自己第一次读到这个标题是什么时候，但她记得那种感觉：像看到某个人终于被正确对待的欣慰。她把书放回箱子里。然后走到窗边。窗外和平时一样——飞行器在高楼之间穿行，全息广告牌在远处闪烁。天很蓝，是她喜欢的那种干净。她忽然想起自己很久以前在档案室门口走廊上听到的那首歌。她不记得歌名了，不记得旋律，不记得歌手的名字。但她记得最后一个音符落下之后，有一个声音说“谢谢”。那个声音的音色她已经完全想不起来了。但她记得听到那个声音时的感觉——胸口突然变轻，眼眶发热。她站在窗前。夕阳正从城市天际线上慢慢沉下去，把玻璃幕墙染成淡金色。练习室凌晨日光灯的颜色，决赛夜金色亮片的颜色，侧幕条漏出来的舞台光的颜色。她抬起手，对着光看了看自己的手指。老了——关节微微变形，皮肤上有细小的皱纹。但手指不抖。她把手放下，对着窗外轻轻说了一句：“不用谢。”声音很轻。没有人听到。但她说的时候，胸口那个背了太久的重量，彻底松了下来。

<script type="text/plain" id="novel2"> 《星途第五人》 第一章：麻辣烫与星光---六月的成都，热得像蒸笼。林星野蹲在面馆后厨的洗碗池前，橡胶手套上全是洗洁精的泡沫，额前的碎发被汗水黏在太阳穴上。她妈林秀兰在外面招呼客人，嗓门大得隔着三条街都能听见——“二两牛肉面！多加香菜！”“三两杂酱，面硬一点！”“星野！把那摞碗端出来！”“来了来了。”她甩了甩手上的水，端着一摞洗好的白瓷碗往外走。面馆不大，六张桌子，下午两点了还坐了四桌客人。墙上贴着泛黄的菜单，风扇吱呀吱呀地转，吹不走那股子牛油和花椒混合的气味。这是她从小闻到大的味道。“给你。”她把碗放到灶台上，顺手抄起抹布擦了擦桌子。林秀兰瞥她一眼：“你明天不是要去上海？票买好了？”“嗯。”“钱够不够？”“够。”“你爸让你别省钱，该吃吃该喝喝。”林星野笑了：“妈，我就去两天，又不是不回来了。”她没告诉爸妈，这张粉丝见面会的门票花了她整整两个月的生活费。也没告诉他们，为了凑够路费，她上个月帮三个同学代考了体育课的太极拳考试，一人一百。更没告诉他们，这是她送给自己的二十岁生日礼物。她妈要是知道了，肯定会说：“花那个冤枉钱干啥？人家明星认识你是谁？”确实不认识。但这不重要。林星野回到后厨，从围裙兜里掏出手机，屏幕上是那张她已经看过一千遍的电子票——【迪丽热巴·上海粉丝见面会】【时间：6月15日 19:00】【座位：A区12排7座】她盯着“迪丽热巴”四个字看了三秒钟，然后锁屏，把手机塞回去，继续洗碗。---晚上十点，面馆打烊。林星野洗完澡躺在宿舍的床上，室友沈青已经敷着面膜凑过来了。“明天的票，你确认过了吧？”“确认了。”“几点的高铁？”“早上七点。”“那你还不睡？！”“睡了。”林星野翻了个身，把被子拉到下巴。沈青关掉大灯，只留了一盏床头小灯。面膜在脸上泛着冷白色的光，像个沉默的水母。过了大概十秒钟，她还是没忍住——“你真的要见到迪丽热巴了诶。”“……嗯。”“活的！迪丽热巴！”“嗯。”“你怎么不激动啊？！”林星野把脸埋进枕头里，闷闷地说了一句：“我激动得睡不着。”沈青笑了：“我就知道。”灯灭了。宿舍里只剩下空调嗡嗡的声音。林星野睁着眼睛，看着上铺的床板。手机压在枕头下面，她伸手摸了摸那张电子票——准确地说，是摸了摸手机屏幕里那张电子票的位置。她想起自己第一次在电视上看到迪丽热巴。那是2017年，《三生三世十里桃花》正在热播。她窝在面馆的角落里写作业，电视里凤九穿着粉色的裙子，红着眼睛说“帝君，你为什么要这样对我”。她当时觉得，这个世界上怎么有人长成这样。后来她开始关注热巴的剧、综艺、采访。不是那种疯狂的追星，更像是一种……遥远的陪伴。每次看到热巴在舞台上闪闪发光的样子，她都会想：原来女孩子可以活得这么好看、这么有力量。她知道这很矫情。但她没跟任何人说过。---第二天早上六点，林星野轻手轻脚地起了床。沈青翻了个身，含混地说了一句“加油”，又睡过去了。她背着那个洗得发白的帆布包，坐地铁到了成都东站。高铁六个半小时，她没舍得买盒饭，啃了两个在家装的面包。下午一点半，上海虹桥。她站在出站口，被人流推着往前走。周围是陌生的城市、陌生的口音，空气比成都闷，天比成都矮。她掏出手机，导航到见面会的场馆。先坐地铁，再换公交，再走十五分钟。到了。那是一个中型剧场，门口已经排起了长队。到处都是举着手幅的女孩，有人穿着热巴同款的衣服，有人化了精致的妆，有人和朋友说说笑笑，有人一个人安静地等着。林星野排在队伍的中间偏后。她没举手幅，没穿应援服，甚至没化妆——早上太早了，她怕吵醒沈青，就洗了个脸涂了个防晒霜就出门了。帆布包里只有一瓶水、一个充电宝、一本《舞蹈编导基础教程》（她打算在回程高铁上看），还有那条她编了很久的手链——不是买的，是她自己用彩绳编的，配色是热巴最喜欢的粉色和白色。她打算如果能近距离看到热巴，就把手链递过去。当然，大概率递不过去。队伍慢慢往前挪。检票、安检、入场。A区12排7座。不算近，也不算远。舞台上的灯光还暗着，大屏幕上循环播放着热巴的代言广告。她坐下，把帆布包抱在腿上，忽然觉得手心全是汗。旁边坐了一个穿蓝色连衣裙的女孩，看起来比她大两三岁，手里拿着专业相机，镜头长得像炮筒。“你一个人来的？”蓝裙子女孩主动搭话。“嗯。”“我也是！”蓝裙子笑了，“你是哪里的？”“成都。”“哇，好远。我是杭州的，坐高铁一个多小时就到了。”“嗯，我坐了六个半小时。”蓝裙子愣了一下，然后认真地说：“你绝对是真爱。”林星野笑了笑，没说话。---七点整，灯光暗了。全场尖叫。一束追光打在舞台中央，升降台缓缓升起。迪丽热巴穿着一条白色的连衣裙，长发微卷，笑着朝台下挥手。“大家好，我是迪丽热巴。”她的声音通过音响传出来，比视频里更好听——有一种温柔的质感，像是丝绸落在地上。林星野整个人僵住了。她见过热巴无数次——在屏幕上、在手机里、在广告牌上。但这是第一次，她们之间没有屏幕。热巴是活的。她会眨眼睛，会笑出小虎牙，会因为台下粉丝的喊话害羞地捂住脸。她不是那个被修图软件磨皮到完美的平面影像，而是一个会喝水、会撩头发、会偷偷看提词器的真实的人。林星野发现自己眼眶有点热。她使劲忍住了。见面会的流程很常规——主持人问答、游戏互动、抽奖环节、粉丝送礼物。热巴在台上很放松，时不时冒出一些可爱的小表情，全场气氛一直很热烈。到了最后环节，热巴要抽取五位幸运粉丝上台合影。“来，我喊停，大屏幕就停。”热巴背对着大屏幕，手指在空中画圈，“三、二、一——停！”大屏幕定格。座位号：C区7排3座。幸运粉丝尖叫着跑上台。第二轮。“三、二、一——停！”A区12排7座。林星野低头看了一眼自己的座位号，愣住了。蓝裙子女孩猛地推了她一把：“是你！是你啊！！！”她脑子里一片空白，身体却已经站了起来，被旁边的人推着往过道走。工作人员在边上引导：“这边，这边上楼梯。”她走上舞台的时候，腿是软的。聚光灯打在她脸上，什么都看不清。只有热巴站在几步之外，笑着朝她招手。“来，站我旁边。”热巴说。林星野走过去，站到了热巴身边。她们之间的距离，不到半米。她能闻到热巴身上的香水味——不是那种浓烈的商业香，而是淡淡的、干净的，像清晨的肥皂。“你叫什么名字？”热巴侧过头看她。“林星野。”“林星野，”热巴重复了一遍，笑了，“名字好好听。”拍照的时候，热巴的手轻轻搭在她肩膀上。三秒钟。闪光灯闪了三下。然后工作人员引导她们下台。林星野走了一半，忽然想起来——手链还没送。她猛地转身，差点和身后的粉丝撞上。热巴正低头和另一个粉丝说话，没注意到她。她犹豫了一下，还是走下了舞台。算了。见面会结束后，主办方安排了一个小环节：每位粉丝退场时可以领一份伴手礼，是热巴代言的护肤品小样。林星野排在队伍里，低着头看手机——沈青发了一百多条消息，她一条都没来得及回。忽然，前面一阵骚动。“怎么了？”“好像是后台出了什么问题……”“灯牌支架倒了？有人受伤吗？”“不知道不知道……”林星野抬头，看到工作人员在往后台方向跑。她下意识地跟了过去——不是想凑热闹，纯粹是身体比脑子快。后台的走廊很窄，堆满了设备和箱子。她挤过去的时候，正好看到一群人围在一起，中间是——迪丽热巴。她背对着林星野，旁边助理在说什么，听不清。但林星野看到了那个倒下来的灯牌支架——金属的，很沉，横在地上。旁边还有一个摔碎的玻璃杯。如果再偏一点，砸到的就是热巴的头。林星野脑子里冒出一个念头：灯牌支架为什么会在粉丝通道附近？这不合理。但她没时间多想。因为热巴的助理在喊：“有没有人帮忙搭把手？这个支架要搬走，挡住路了。”几个工作人员过去抬支架，但角度很别扭，使不上劲。林星野放下帆布包，走过去。“我来。”她弯腰抓住支架的底座，沉下重心，用了一个舞蹈训练里常练的“蹲起发力”——腰背挺直，核心收紧，腿发力。她练了十几年的舞，什么肌肉控制没做过？支架被她稳稳地抬了起来。旁边两个工作人员赶紧过来接住，一起搬走了。林星野拍了拍手上的灰，弯腰捡起帆布包，准备走。“等一下。”她转头。迪丽热巴正看着她。近距离看，热巴的眼睛比镜头里更大、更深。她卸了一半妆，眼妆还没擦干净，整个人看起来比舞台上素净很多，但还是很漂亮——一种不设防的漂亮。“你刚才一个人抬起来的？”热巴问。“……嗯。”“你是练什么的？力气好大。”热巴笑了，语气很随意，不像在台上那种营业式的笑，而是真实的、带着好奇的笑。“我学跳舞的。”“难怪，”热巴点点头，“动作很利落。”她低头看到了林星野抱在怀里的帆布包上挂着的手机——手机壳是BLACKPINK的，四人的合照，磨砂材质，边角已经磨白了。“BLINK？”热巴问。林星野愣了一下：“嗯。”“我也是，”热巴弯了弯嘴角，“我特别喜欢Lisa。”林星野不知道该说什么。她觉得自己的脑子已经停机了。热巴的助理走过来，小声说：“姐，该走了，车在等了。”热巴点点头，从助理手里拿过一张便签纸，飞快写了什么，递给林星野。“这是我的工作号。今天谢谢你，回头请你吃好吃的。”然后她跟着助理走了。高跟鞋踩在地板上，笃笃笃，越来越远。林星野站在原地，低头看着那张便签纸。上面是一个电话号码，还有一行字——“谢谢你哦。💕”她把便签纸折好，放进了帆布包里最里层的夹层。旁边一个工作人员小声嘀咕了一句：“那个灯牌支架怎么会倒啊？明明检查过的……”另一个工作人员嘘了一声：“别说了，赶紧收拾。”林星野听到了。但她没有多想。---三天后，成都。林星野已经回到了日常的轨道里——上午上课，下午练功房，晚上在面馆帮忙。她几乎没有跟任何人提起见面会的事，包括沈青。不是不想说，是不知道该怎么说。“我上台和热巴合了影，还在后台帮她抬了灯牌，她给了我电话号码”？这听起来像做梦。沈青要是知道了，一定会尖叫到整栋楼都听见。她还没准备好应付那个场面。那条手链一直放在桌上，她没送出去。有时候她看着那条手链，会想：如果那天在台上把礼物递过去，会不会不一样？然后她会告诉自己：别想了，本来就不该有什么“不一样”。直到第七天。那天晚上，面馆打烊后，林星野洗完澡躺在宿舍床上，手机屏幕的光照着她的脸。沈青已经睡了，呼吸均匀。她打开微信，通讯录那里有一个红色的“1”。好友申请。头像是——一只布偶猫。备注写着：“我是迪丽热巴。谢谢你那天帮忙。😊”林星野盯着这条好友申请，看了整整一分钟。然后她把手机屏幕转向沈青的方向，捅了捅她的被子。“沈青。”“嗯……”沈青迷迷糊糊的。“沈青，醒醒。”“干嘛……”“迪丽热巴加我微信。”沈青“嗖”地坐了起来。“你说什么？！”林星野把手机递过去。沈青看了一眼屏幕，又看了一眼林星野，又看了一眼屏幕。然后她尖叫了。整栋楼都听见了。隔壁宿舍有人敲门：“怎么了怎么了？谁出事了？”沈青捂着嘴，眼睛瞪得像铜铃，声音从指缝里挤出来：“她加你了。迪丽热巴。加你了。”林星野拿回手机，看着那个好友申请。她的拇指悬在“通过”上方，停了三秒钟。然后她按了下去。对话界面弹出来。空白的输入框，光标一闪一闪的。她想了很久，打了四个字：“姐姐你好。”发出。对面几乎是秒回——“小朋友好。😊”窗外，成都的夜风从阳台上吹进来，带着夏天的味道。林星野不知道的是，这将是改变她命运的第一个句号——不，是第一个逗号。故事才刚刚开始。---*（第一章完）* 《星途第五人》 第二章：姐姐，你好---林星野盯着那个“姐姐你好”四个字，觉得自己像个傻子。对面已经回了“小朋友好”，但接下来该说什么？她完全不知道。她平时不是不会聊天的人——和沈青能聊到凌晨三点，和舞室的队友能从天亮跳到天黑。但对面是迪丽热巴。不，对面是“迪丽热巴”。不是那个在电视里光芒万丈的顶流女明星，而是一个微信头像用布偶猫的人。这两个身份在她脑子里打架。手机又震了一下。“在干嘛呢？”林星野下意识回了一句：“躺在床上。”发完就后悔了——人家问你在干嘛，你说躺在床上，这是什么奇怪的回答？但热巴没有在意。“我刚收工，在吃宵夜。”发来一张照片。剧组休息室的茶几上摆着一碗麻辣烫，红油漂在上面，旁边还有一杯奶茶。热巴的手入镜了，指甲上涂着淡粉色的甲油。林星野盯着那张照片看了好几秒。不是因为麻辣烫，而是因为——热巴给她发了一张生活照。不是精修图，不是广告物料，就是随手一拍、下一秒可能发完就忘的那种照片。像朋友之间会发的那种。她把麻辣烫的照片保存了。“看着好好吃。”她回。“就是普通麻辣烫，但饿了一天什么都好吃。”热巴发了一个叹气表情，然后问，“对了，你说你是学跳舞的？什么舞？”林星野想了想，认真回了：“科班是古典舞和现代舞，但我自己喜欢跳韩舞和街舞。”“哇，双修啊。”“也不算双修，就是什么都想学。”她犹豫了一下，又补了一句，“BLACKPINK的舞我基本都会翻。”热巴发了一个眼睛放光的表情包：“真的假的？你最喜欢哪首？”“《Lovesick Girls》的编舞结构很完整，有叙事感。但跳起来最爽的是《Pretty Savage》，副歌那段力度训练很过瘾。”“你说得好专业。”热巴发了一个大拇指，“我是只会看不会跳的那种。”“你演戏已经很好看了。”“谢谢你哦。”热巴发了一个小熊转圈的表情包，然后说：“我要去卸妆了，明天还要早起。下次聊？”“好。晚安。”“晚安小朋友。”林星野把手机放在胸口，盯着天花板。沈青在旁边等了好久，终于忍不住了：“聊完了？她说啥了？你们聊了什么？她人怎么样？是不是和电视上一样？”林星野把手机递给沈青看。沈青看了三秒钟，然后把手机砸回林星野身上：“你全程叫她‘姐姐’？她叫你‘小朋友’？你们这是什么偶像剧设定？”“那我要叫她什么？热巴姐？巴姐？”“你叫她姐姐就挺好了。”沈青翻了个白眼，躺回去，又“嗖”地坐起来，“等等，她说明天早起？她明天拍什么戏你知道吗？是不是那个新电影？我听说她在拍一个民国戏——”“我不知道。我没问。”“你怎么不问问呢！”“因为那是人家的工作。”沈青看着林星野认真的表情，忽然笑了：“你这个人，追星都追得这么有边界感。”林星野没说话，把手机充上电，翻了个身。她闭上眼睛，脑子里是那张麻辣烫的照片、那个小熊转圈的表情包、那句“晚安小朋友”。她忽然觉得，这个世界上有些事情，比跳舞还让人睡不着。---接下来的半个月，热巴和林星野的聊天渐渐变成了一种日常。不是每天都聊，热巴忙起来会消失两三天，但每次出现都会接上上次的话题，好像在继续一场没有暂停的对话。热巴会发片场的照片——穿古装蹲在角落里吃盒饭的、躺在道具床上睡着的、和工作人员斗嘴被抓拍的。林星野会发练功房的视频——大汗淋漓的自拍、脚上磨出的水泡、地板上一滩一滩的汗印。有一次热巴问：“你每天练多久？”“没课的话五六个小时，有课的话两三个小时。”“不累吗？”“累。”林星野想了想，又加了一句，“但停下来会更累。”热巴看了这句很久，回了一句：“我懂。”就两个字，但林星野觉得她真的懂。还有一次，热巴忽然问：“你以后想干嘛？跳舞吗？”林星野犹豫了。她很少被人问这个问题。面馆的客人问过她“小姑娘学什么专业”，同学问过她“毕业打算去哪儿”，但没有人问过她“你想干嘛”。“想。”她打了一个字，然后又删掉，重新打：“我想站在舞台上。不是给别人伴舞的那种，是自己站在中间的那种。”发出去之后，她觉得这句话好中二。二十岁的人了，还说这种话，像个小学生。但热巴没有嘲笑她。“那你一定要去追啊。”热巴说，“我当年在上戏的时候，也不知道自己能不能红。但如果你不试一试，就永远不知道。”林星野看着这句话，把它截了图。存进了相册里一个叫“星星”的文件夹。那个文件夹里还有热巴发过的麻辣烫照片、小熊转圈表情包，以及第一次聊天时那句“小朋友好”的截图。她没敢告诉任何人。---七月下旬的一个晚上。林星野在面馆帮忙，手机放在围裙兜里，震了一下。她擦干手，拿出来看。热巴发来了一条新闻链接，标题是——【YG娱乐官宣：BLACKPINK五人完整体补位选拔，全球招募，不限国籍、不限练习生背景】紧接着热巴又发了一条消息：“你看这个。”林星野盯着那个标题，觉得心脏跳得有点快。她点开链接，一边看一边走到面馆门口，靠着门框。新闻里写得很详细。YG娱乐今天下午召开记者会，宣布BLACKPINK将在明年开启新一轮全球巡演，同时启动“第五人补位计划”。选拔面向全球，不限国籍、不限练习生履历，官方强调——“天赋与热爱优先于训练时长”。BLACKPINK成员Jennie在记者会上说：“我们想要一个有舞台灵魂的人，不是复制品，而是能带来新能量的伙伴。”Lisa说：“跳舞厉害的人很多，但能和我们产生化学反应的很少。我们在找那个人。”新闻最后说，选拔将分为初选、复选、终选三轮，最终入选者将成为BLACKPINK第五位成员，参与明年开始的全球巡演及后续专辑制作。林星野把这则新闻看了三遍。然后她给热巴回了一条：“我看到了。”“你不报名？”热巴秒回。“我？”“对啊，你不就是跳舞的？你不就是BLINK？你不就是想站舞台中间？”林星野不知道该怎么回。她说得都对，但——“我又没当过练习生，我不会韩语，我什么都没有。”“报名条件又没说要练习生经历。”热巴说，“你去试试，试试又不会少块肉。”林星野站在面馆门口，看着这条消息。成都七月的晚风是热的，吹得她额前的碎发往两边飘。面馆里林秀兰在喊“星野！三号桌收一下碗”，她没有动。“我帮你找个韩语老师。”热巴又发了一条，“你先学着，就当多门手艺。”林星野咬了咬嘴唇。“你先别急着拒绝，”热巴说，“回去想想，明天再告诉我。”林星野没回这条。她把手机塞回围裙兜里，转身进去收碗。三号桌坐着一个中年男人，碗里剩了半碗汤，筷子横在碗上。她端起碗的时候，手有点抖。---晚上回到宿舍，林星野躺在床上，翻来覆去睡不着。沈青已经睡了，手机充着电放在床头，屏幕偶尔亮一下，是粉丝群的消息。林星野打开了YG官方的选拔页面。报名截止：8月15日。还剩二十天。初选要求：上传一支3分钟以内的舞蹈视频，风格不限。她翻来覆去地看报名条件——“不限国籍、不限练习生背景”。那行字好像一直在对她说：你可以。但我真的可以吗？她把手机扣在胸口，闭上眼睛。脑子里跑过很多东西。小时候在面馆的角落里对着电视机跳舞，被客人笑话过。初中老师说她“只会跳舞不会读书”，她哭了整整一个晚上，第二天还是去练功房压腿。高中拿了四川省街舞大赛冠军，但文化课成绩不够，去不了北舞。来了这所学校，同学问她“你为什么不去考专业院校”，她笑着说“考不上”，但心里其实一直在疼。跳舞是她唯一擅长的事。可是——“擅长”和“够好”之间，差了多远？“够好”和“够格站在BLACKPINK身边”之间，又差了多远？她不知道。她翻了个身，把脸埋进枕头里。不知道过了多久，手机亮了。热巴发了一条语音。她犹豫了一下，戴上耳机点开。热巴的声音从耳机里传出来，有点沙哑，像是刚收工还没缓过来：“小朋友，我知道你在想什么。你一定在想‘我不够好’对不对？但我告诉你，这个世界上‘够好’的人很多，敢去试的人很少。你跳舞的样子我看过，你不是那种‘练出来的’，你是那种‘长出来的’。你想站在舞台中间，那就要先站上舞台。报名又不花钱，你就当帮我一个忙，让我看看你能走多远。”语音到这里就结束了。没有“晚安”，没有“加油”。就是这段话。林星野听了一遍，又听了一遍，又听了一遍。然后她把报名链接转发给了沈青。沈青的手机亮了。过了大概十秒钟，沈青“嗖”地坐起来：“你转发这个给我干嘛？”“我想报名。”沈青的尖叫再次惊动了整栋楼。---第二天，林星野给热巴回了消息：“我报。韩语老师的事拜托你了。”热巴发了一个大拇指，然后发了一个联系人名片：“我经纪人的韩语老师，人很好，我跟她说过了，她会联系你。”林星野看着那个名片，忽然问了一句：“姐姐，你为什么对我这么好？”对面隔了很久才回。“因为我刚出道的时候，也有人这样帮过我。”没有更多解释。林星野看着这行字，忽然觉得热巴不是“迪丽热巴”，不是那个顶流女明星，而是一个曾经也迷茫过、也害怕过、也被别人拉过一把的普通人。她回了一个：“我知道了。”热巴发了一个摸摸头的表情包。林星野存了。---接下来的日子，林星野像上了发条一样。早上六点起床，背韩语四十音。上午上课。下午练功房。晚上在面馆帮忙的间隙刷韩语单词。十点回宿舍，编舞、录视频、删掉、重录、再删掉、再重录。韩语老师姓朴，是个在成都留学的韩国女生，人很温柔，教得也很耐心。林星野学得很快，朴老师说“你有语言天赋”。她不知道这算不算天赋，她只知道，每次她想偷懒的时候，就会想起热巴那句“你想站在舞台中间，那就要先站上舞台”。她想站上去。初选视频，她选了BLACKPINK的《Pink Venom》，但做了一些改编。原版的编舞偏力量型，她在中间加了一段中国舞的身韵——云手、翻身、含腆。不是生硬的拼接，而是把两种风格揉在一起，像把辣椒放进巧克力里，听起来奇怪，但吃起来莫名和谐。她用手机拍了不下五十遍。角度不对，重拍。光线不好，重拍。表情不到位，重拍。最后一个动作收尾时呼吸太重，重拍。沈青在旁边看不下去了：“我觉得第二十遍就已经很好了。”林星野摇头：“不够。”她终于在截止日期的前一天，拍出了满意的一版。画面里的她穿着黑色背心和运动裤，头发扎成马尾，站在学校的天台上。夕阳在她身后，把她整个人镀上一层橘色的光。音乐响起，她动了起来。那支舞她练了几百遍，每一个动作都已经刻进了肌肉记忆里。但在这一刻，她不是在“复刻”编舞，而是在“说话”。用身体说话。最后一帧，她定格在镜头前，胸口起伏着，眼神没有躲闪。她看着镜头里的自己，忽然觉得——这个人是会发光的。她点了“提交”。系统显示：上传成功。她靠在椅背上，长长地呼了一口气。手机响了，热巴发来消息：“提交了？”“嗯。”“好，等消息吧。”林星野把手机放下，看着天花板。她不知道接下来会发生什么。但她知道，她做了二十年来最勇敢的一件事。---等待的时间比想象中长。官方的结果公布时间一拖再拖，网上说是因为报名人数远超预期——全球三千多人，创下了K-POP选拔的历史纪录。林星野每天刷八百遍邮箱，刷到手机都快被她刷穿了。沈青说：“你能不能别看了？有了自然会来。”“我知道，但我控制不住。”热巴倒是很淡定，说：“该来的总会来。你去练舞，别干等。”林星野听了她的话，把手机锁进抽屉里，去了练功房。直到第八天。那天她在面馆帮忙，正在给客人端面，手机在围裙兜里震了一下。她把面放下，擦干手，掏出手机。一封邮件。标题是：【YG ENTERTAINMENT】BLACKPINK 5TH MEMBER AUDITION - PRELIMINARY RESULT她的手开始发抖。点开。第一行字：“Congratulations.”她站在面馆的过道里，面前是热气腾腾的锅灶，身后是客人嘈杂的说话声。林秀兰在喊“星野！五号桌的饺子好了”。她的眼泪掉了下来。不是因为悲伤，不是因为高兴。而是因为——原来这个世界上，真的有些事情，是可以实现的。手机又震了。热巴发来一条消息：“我知道你过了。”林星野回：“你怎么知道？”“因为我也在等。”林星野看着这条消息，哭得更厉害了。林秀兰端着饺子从她身边经过，看到她满脸泪痕，吓了一跳：“怎么了？烫着了？”林星野摇摇头，抹了一把眼泪，笑了。“妈。”“嗯？”“我要去韩国了。”“去韩国干嘛？”“去追梦。”林秀兰看着女儿，沉默了两秒钟，然后把饺子放在五号桌，转身回来，从围裙兜里掏出一张皱巴巴的五十块钱，塞到林星野手里。“拿着。买瓶水路上喝。”林星野攥着那张五十块钱，又想哭了。但她忍住了。她深吸一口气，把眼泪憋回去。然后她打开和热巴的对话框，打了四个字：“姐姐，谢谢你。”热巴回了五个字：“这才刚开始。”---*（第二章完）* 《星途第五人》 第三章：200分之1---林星野从来没有坐过飞机。准确地说，她连成都都没出过几次。最远的一次是去重庆参加街舞比赛，当天去当天回，连火锅都没来得及吃。但现在她坐在飞往首尔的航班上，座位靠窗，膝盖上放着一个旧帆布包，包里装着换洗衣服、热巴送的那条手链，以及一颗跳得乱七八糟的心脏。沈青本来要送她到机场，但临出发前哭了，说“我怕我忍不住”，最后只在宿舍楼下抱了她一下，把一包辣条塞进她包里说“想家了就吃一口”。林星野当时觉得好笑，现在觉得那包辣条可能是她接下来最宝贵的东西。飞机起飞的时候，她紧紧抓住扶手，手心全是汗。旁边的座位上坐着一个韩国大叔，戴着眼罩睡觉，完全不知道身边这个中国女孩正在经历人生中最紧张的时刻。她闭上眼睛，脑子里反复过着那封邮件的每一句话——“恭喜您通过初选。请于8月25日前抵达首尔，参加第一轮线下选拔。届时将有200名来自全球的候选人共同角逐50个晋级名额。”200进50。她在心里默念这个数字。初选3000人，刷到200人，她是其中之一。但从200到50，要刷掉四分之三。而她连韩语都只会说“你好”“谢谢”“对不起”。她睁开眼睛，从包里摸出手机，给热巴发了一条消息：“上飞机了。”热巴秒回：“到了给我报平安。记住，你已经比很多人勇敢了。”林星野看着这条消息，深吸了一口气，把手机塞回包里。窗外的云层厚得像棉花田，阳光在云边上镀了一层金。她想，如果这次不行，至少她看过韩国的云了。---仁川机场比成都双流机场大三倍。林星野推着行李车，跟着人流往外走，一路上全是韩文标志，她只能靠猜和手机翻译。好在YG安排了接机人员，一个戴眼镜的年轻男生举着写了她名字拼音的牌子站在出口。“林星野小姐？”他用韩语问。她没听懂，但看到了自己的名字，点了点头。“请跟我来。”她跟着他上了一辆黑色商务车，车里已经坐了三个人——一个染着粉红色头发的女孩、一个戴着棒球帽的男生、一个穿着全身黑的姐姐。粉头发女孩看到她，用英文问：“Where are you from?”“China.”“Oh! Me too!”粉头发女孩切换成中文，“我从吉林来的，你呢？”“成都。”“成都火锅好吃！”粉头发女孩笑了，“我叫赵恩熙，你呢？”“林星野。”棒球帽男生和黑色衣服姐姐也各自报了名字和国籍——男生叫Kenji，日本人；黑色衣服姐姐叫Sara，美籍韩裔。四个人用英文、中文、韩语混杂着聊了几句，气氛还算轻松。但林星野注意到，每个人都在偷偷打量其他人。不是那种好奇的打量，而是——评估。你有多强？你是我需要打败的人吗？车里安静下来之后，林星野转头看窗外。首尔的天比成都低，楼比成都高，路上的女孩子穿着精致的衣服，妆容完美得像从画报里走出来的。她低头看了看自己。白色T恤，黑色运动裤，帆布鞋，素颜。她忽然觉得自己像一颗从土里刨出来的土豆，被放在了一堆精包装的进口水果中间。车开了四十分钟，停在了一栋灰白色的大楼前。YG娱乐。她站在门口，仰头看着那个标志性的logo，心脏跳到嗓子眼。赵恩熙在旁边小声说：“我的天，我真的站在这里了。”林星野没说话，但她心里在想同一件事。我真的站在这里了。---报到、领号码牌、分配宿舍。200名候选人被分成四组，每组50人，住在YG附近的集训中心里。两人一间，房间不大，但干净整洁。林星野的室友是赵恩熙——那个粉头发的吉林女孩。赵恩熙比她小一岁，但已经是某练习生培训机构的“老油条”了，参加过两次选秀，虽然都没出道，但经验丰富。“你之前在哪家公司练过？”赵恩熙一边拆行李一边问。“没有。我就是在学校跳舞的。”赵恩熙的手停了一下，转头看她：“你是素人？”“嗯。”赵恩熙愣了一下，然后笑了：“你好厉害。素人能进200强，那你是真的强。”林星野不知道该说什么，只好笑了笑。但她注意到赵恩熙的眼神里有一种东西——不是轻视，而是“原来如此”的释然。好像她一直在担心林星野是强劲对手，现在知道她是素人，就不担心了。林星野没说出来。但她记住了这个眼神。---第一轮考核在报到的第二天。200名候选人被集中在一个巨大的舞蹈室里，四面都是镜子，地板锃亮得能照出人影。YG的编舞团队和制作人坐在对面，一字排开，表情严肃得像在阅兵。林星野站在人群里，前面、后面、左边、右边都是人。她第一次用“密密麻麻”来形容一个舞蹈室。考核方式是——即兴编舞。每组20人，按顺序上场。音乐随机播放，每人有45秒的时间即兴发挥。这意味着你不能提前准备，不能挑音乐，甚至不知道下一首要跳什么。这是真正硬碰硬的考核。没有套路，没有编排，没有第二次机会。只有45秒。林星野被分到第三组，上场顺序是第15个。她站在场边等待的时候，前面14个人一一上场。第一个人是Sara——那个美籍韩裔的黑色衣服姐姐。音乐是一首慢板的R&amp;B，她跳了一段极其性感的现代舞，每个动作都像水一样流动，结束的时候，评委席上有人点了点头。第二个人是一个没说过话的韩国男生，跳了Breaking，地板动作干净利落，力量感十足。第三个人、第四个人、第五个人……一个比一个强。林星野看着看着，手心开始冒汗。这些人不是“喜欢跳舞”而已，他们是“职业选手”。有人从小在三大娱乐公司训练，有人已经出过道，有人在YouTube上有几十万粉丝。而她呢？她在学校的练功房里对着镜子练了四年，在面馆的厨房里偷偷练过步伐，在天台上拍过视频。但她从来没有在这么多人面前、在专业评委面前、在这种高压环境下跳过。她的手开始抖。赵恩熙从她旁边经过，小声说了一句：“别想太多，把平时练的拿出来就行。”林星野点了点头，但脑子里已经乱成了一锅粥。“下一位，15号。”她深吸一口气，走上前去。站在场地中央，四面都是镜子，镜子里映出她苍白的脸。音乐响起——是一首Trap，节奏很快，鼓点密集。她的身体先于大脑做出了反应。这是一个下地动作——她顺势做了一个Wave，从手指尖传到脚趾尖，然后一个Poppin的震点，卡在鼓点上。她不知道自己在跳什么，只是让身体跟着音乐走。古典舞的身韵、街舞的律动、现代舞的延展——所有她学过的东西像被打翻的调色盘一样混在一起，在这个45秒里全部倾倒了出来。最后一个音落下的时候，她定格在一个跪地的姿势上，胸口剧烈起伏。整个舞蹈室安静了两秒钟。然后她听到了掌声——不是评委的，是旁边候选人的。她站起来，鞠了个躬，走回队伍里。赵恩熙拉着她的胳膊，眼睛亮得发光：“你刚才那段，太绝了。”林星野觉得自己像是被人从水里捞出来一样，浑身是汗，腿发软。她不知道自己跳得怎么样。但她知道，她把命都交出去了。---第一轮的结果在当天晚上公布。200人名单贴在了集训中心大厅的公告板上，晋级的人用蓝色标记，淘汰的人用灰色。林星野和赵恩熙挤在人群里，踮着脚尖往公告板上看。她从最后一名开始往前找——没有她的名字。再往前——没有。再往前——还是没有。她的心一点一点往下沉。赵恩熙忽然拉住她的胳膊，声音尖得刺耳：“你在这里！”林星野顺着她的手指看过去。第48名。蓝字。她晋级了。200进50，她是倒数第三。不是荣耀，但够了。赵恩熙也晋级了，第32名。两个人抱在一起跳了两下，然后各自回到房间，谁都没说话。林星野坐在床上，看着那张晋级名单的照片。她给热巴发了一条消息：“还活着。”热巴回了四个字：“活着就好。”然后是第二条：“继续。”林星野把手机放下，倒在床上。她脑子里反复回放着今天下午的画面——那些比她强的选手，那些她差点够不到的动作，那个评委们面无表情的脸。她忽然意识到一件事。她能晋级，不是因为她足够好。而是因为评委们在她身上看到了一些“可以被打磨”的东西。但如果她只是“可以被打磨”，而别人已经是“成品”——她能走多远？她不敢想。闭上眼睛，强迫自己睡觉。明天还有第二轮。---第二轮是分组任务。50人分成10组，每组5人，合作完成一支完整舞台表演。排练时间只有三天，第三天晚上登台演出，评委现场打分，每组的前三名晋级，后两名淘汰。这意味着每组只有60%的晋级率，而且不是看个人表现，而是看团队合作。林星野被分到了第6组。同组的四个人：一个韩国男生叫金俊浩，24岁，当过两年练习生；一个日本女生叫Mai，22岁，舞蹈学院毕业；一个泰国女生叫Fah，21岁，参加过泰国选秀；还有一个中国男生叫周逸飞，20岁，和她一样是素人。金俊浩是队长，因为他是唯一有练习生经验的人。他看了一眼组员名单，第一句话是：“我们需要编舞。谁会编舞？”Mai举手：“我可以。”周逸飞举手：“我也可以。”林星野犹豫了一下，也举了手：“我也可以。”金俊浩看了她一眼，目光在她身上停了一秒，然后说：“Mai和周逸飞负责编舞，其他人跟着练。”林星野把手放下来。她没有争辩。但她注意到，金俊浩甚至没有问她会编什么风格。她知道为什么——因为她是“素人”。素人意味着没有经验、没有资历、没有话语权。她没有生气。因为她知道，在韩国练习生体系里，金俊浩这种“当过两年练习生”的人，确实比她更有资格说话。她只是有点难受。不是因为委屈，而是因为她终于明白了赵恩熙第一天看她时的眼神——“素人”这两个字，在这个圈子里，就等同于“不专业”。她要把这个标签撕掉。---排练的过程比想象中艰难。Mai和周逸飞编了一支舞，融合了Hip-hop和Jazz，动作不难但走位复杂。五个人要在一首歌的时间里完成多次队形变换，任何一个人走错一步，整个画面就会乱。第一天排练，林星野学得最快。不是因为她天赋异禀，而是因为她习惯了高强度扒舞——翻跳BLACKPINK的视频，她经常要在一个晚上扒完一整支舞。三小时的排练，她已经把所有动作和走位都记住了。但金俊浩没有夸她。他只是说了一句：“你动作太大了，收一点。”林星野点头，把幅度缩小。第二天排练，Fah有一段solo怎么都跳不好，急得快哭了。金俊浩站在旁边皱着眉头，没说话。林星野走过去，小声用英文说：“我帮你顺一遍？”Fah点头。林星野放慢速度，把solo拆成八个八拍，一个动作一个动作地带她走。Fah学得很快，半个小时后就顺下来了。Mai在旁边看到了，对林星野说：“你教得好好。”林星野说：“因为我也是刚学的。”Mai笑了，没说什么。但金俊浩看到了这一切，依然没说什么。第二天晚上，所有组都在加练。林星野练到凌晨一点，回宿舍洗了个澡，躺在床上翻来覆去睡不着。她拿出手机，给热巴发了一条消息：“姐，如果别人不信任你，你怎么办？”热巴过了几分钟回了：“用结果说话。”林星野看了这五个字，把手机放在枕头下面，闭上眼睛。用结果说话。好。---第三天，正式演出。舞台上灯光亮起，五个人站在各自的位置上。音乐前奏响起的时候，林星野深吸了一口气。她想，这是她的第一个舞台——不是学校的汇报演出，不是天台的即兴录像，而是真真正正的、有人评判、有人观看、能决定她命运的舞台。热巴说得对。用结果说话。音乐炸开的那一瞬间，她把自己全部扔了进去。每一个动作都做到了极致，每一次走位都卡得精准。她不是为了出风头，而是为了让整个舞台看起来更好——该收的时候收，该放的时候放，该给队友让位的时候绝不多占一秒。金俊浩在她左边，有一段双人配合，两个人要对看、同步动作。林星野看向他的时候，发现他的眼神变了。不再是之前那种“你是素人我不信任你”的眼神。而是一种“你做到了”的眼神。三分半钟的表演结束。五个人站在舞台上，喘着气，等着评委的评判。主评委是一个四十多岁的男人，戴着黑框眼镜，表情一直很严肃。他看着手里的评分表，说了一句话——“第6组，整体完成度很高。”然后他一个一个地点评。“金俊浩，稳定，但可以更有攻击性。”“Mai，编舞能力强，但表演时表情管理需要加强。”“Fah，进步最大，solo那段很漂亮。”“周逸飞，基础扎实，继续努力。”最后，他看着林星野。“你之前是练习生吗？”林星野摇头：“不是。”评委点了点头，在评分表上写了什么，然后抬起头，说了一句让她永远忘不了的话——“你是我今天看到的最干净的动作。不是技术上的干净，而是……你跳舞的时候，没有任何多余的东西。每一个动作都有目的。这是天生的舞台感。”整个后台安静了一秒。然后Mai第一个鼓起掌来。金俊浩转过头看她，嘴巴动了动，好像想说什么，但最后只是伸出手，和她击了个掌。结果公布。第6组晋级三人：金俊浩、Mai、林星野。Fah和周逸飞被淘汰。Fah哭了，周逸飞没有哭，只是沉默地收拾东西。林星野站在旁边，不知道该说什么。她想起三天前，金俊浩分配任务时看她的那个眼神。三天。从“你是素人”到 地练。把动作刻进肌肉记忆里。三点，她终于躺下了，但她知道，明天才是真正的硬仗。第二天下午两点，林星野站在练习室门口，深吸了一口气，推门进去。Jennie已经在里面了，正坐在地板上看手机。看到林星野进来，她站起来，拍了拍裤子。“开始吧。”没有寒暄，没有鼓励，没有“紧张吗”“准备好了吗”。直接开始。音乐响起，两个人同时动起来。这支舞需要高度的默契——不是各跳各的，而是像对话一样，你进我退，你强我弱。但林星野跟不上。不是动作不熟——她昨晚已经练了几百遍，每个动作都刻进了骨头里。而是她不敢。她不敢做太满，怕抢了Jennie的戏。她不敢靠太近，怕破坏队形。她不敢太用力，怕显得笨拙。所以她的动作变得缩手缩脚，像被人捆住了手脚。音乐停了。Jennie站在原地，看着她。三秒钟的沉默。“你刚才在干什么？”Jennie问。声音不大，语气也不凶，但每一个字都像冰碴子。“我……”林星野张口，不知道该说什么。“你在怕我，”Jennie说，“你怕做错，怕抢我风头，怕显得不好看。所以你把所有动作都收了一半。你跳舞的时候，脑子里想的是‘我不要犯错’，而不是‘我要怎么跳好’。”她走近一步，看着林星野的眼睛。“在舞台上，最怕的不是做错，而是不敢做。你不敢做的那个动作，观众会替你尴尬。你收回去的那一半力气，观众会替你可惜。”“再来一遍。”音乐重新响起。这一次，林星野拼命告诉自己：不要怕，不要怕，不要怕。她加大了幅度，用力去够每一个动作。但新的问题出现了——她用力过猛，节奏全乱了，比上一遍还糟糕。音乐停了。Jennie叹了口气。“你今天先回去吧，”她说，“回去想一想，你到底为什么跳舞。”林星野鞠躬，走出练习室，关上门。门关上的那一刻，她的眼泪差点掉下来。她靠在走廊的墙上，仰着头，把眼泪逼了回去。她在心里反复问自己：我到底为什么跳舞？因为喜欢。那为什么在Jennie面前，她连喜欢都不敢表现出来？她不知道。她只知道，今天是她来韩国之后，第一次觉得自己真的不行。手机震了。热巴发来一条消息：“今天怎么样？”林星野看着这条消息，打了一行字：“不太好。”然后又删掉了。换成了：“还行。”发出去之后，她靠在墙上，闭上眼。不行。她不能就这样回去。她站起来，走回练习室——但练习室已经被锁了。她站在门口，看着门上那个“YG”的logo，站了大概一分钟。然后她转身，去了大楼另一头的公共练习区。那里二十四小时开放，是给普通练习生用的，条件差一些，地板有点旧，镜子有裂痕，但有音乐，有空间，就够了。她推开门，打开灯，对着镜子，开始跳舞。一遍。两遍。五遍。十遍。她一遍一遍地跳，一遍一遍地找感觉。不是练动作——动作已经熟了。是练“敢”。敢用力，敢做大，敢靠Jennie近一点，敢在双人配合时看着她的眼睛。她对着镜子里的自己，一遍一遍地说：不要怕。不要怕。不要怕。凌晨两点。她浑身是汗，坐在地板上，喘着气。手机又震了。热巴：“吃了没？”林星野回：“吃了。”热巴发了一个“我不信”的表情包，然后说：“你肯定是没吃。明天记得吃东西，别把自己练坏了。”林星野看着这条消息，忽然鼻子一酸。她回了一个“好”字，然后把手机放下，站起来。继续跳。---第三天。下午两点，林星野走进练习室的时候，Jennie已经到了。她没有坐下看手机，而是站在音响旁边，手里拿着水瓶。“今天你不用跟我跳，”Jennie说，“你跳一遍solo给我看。”林星野愣了一下，但马上点头。音乐响起。她开始跳。第一段，她的动作还有些紧。第二段，慢慢打开了。第三段——她闭上了眼睛。不是因为紧张，而是因为她忽然想明白了一件事。她不是在跳给Jennie看。她是在跳舞。就像小时候在面馆的角落里，对着电视机，没有观众，没有评委，没有“考核”。就是跳舞。因为这个世界上，没有比跳舞更让她开心的事。最后一个动作，她睁开眼。Jennie站在她面前，表情和之前一样平静，但眼神不一样了。不是审视，而是——认可。“你昨晚几点走的？”Jennie忽然问。“凌晨两点多。”“在哪练的？”“公共练习室。”Jennie点了点头，沉默了几秒，然后说了一句让林星野意想不到的话。“我当练习生的时候，也经常在那个房间练到半夜。地板很硬，镜子有裂缝，但那个房间很安静，安静到你能听见自己的呼吸。”她看着林星野。“你听见了吗？你跳舞的时候，呼吸是对的。”这是Jennie第一次夸她。林星野张了张嘴，想说谢谢，但喉咙哽住了。“再来一遍，”Jennie说，“这次我跟你一起。”音乐再次响起。这一次，林星野没有收，也没有过。她只是跳。Jennie在她身边，两个人的动作像镜面一样对称。配合的那一瞬间，林星野忽然明白了一件事——Jennie不是在教她跳舞。Jennie是在教她，怎样用跳舞来对话。而她，终于听懂了。---第四天，第五天。林星野和Jennie的配合越来越默契。朴智英的排练时间在上午，林星野在下午。她们偶尔会在走廊里碰见，点头示意，但从不交谈。但林星野注意到，朴智英每次从练习室出来的时候，脸上都是从容的。不像她——她每次出来都是一身汗，头发贴在额头上，像刚从水里捞出来的。她不知道朴智英跳得怎么样。她只知道，自己每天都在进步。第五天晚上，最后一轮排练结束。Jennie关上音乐，走到林星野面前。“明天就是正式考核了，”她说，“我不跟你说加油。”林星野看着她。“我只跟你说一句话——你站上舞台的时候，不要想这是考核，不要想台下坐着谁，不要想赢了会怎样输了会怎样。你就想一件事。”Jennie停了一下。“这支舞，是你和观众在说话。你要说的东西，只有你能说。”“去吧。”林星野鞠了一个九十度的躬。直起身的时候，她发现Jennie已经转身走了。她站在空荡荡的练习室里，看着镜子里自己。汗水从下巴滴下来，T恤湿透了，头发乱七八糟。但她的眼睛里，有一种东西亮起来了。明天。舞台见。---*（第四章完）*---**下一章预告：Jennie的考验**最终考核日。主舞台，聚光灯，评委席上坐着BLACKPINK全员和YG核心团队。林星野和朴智英先后与Jennie合作同一首曲目。舞台上的意外、Jennie的评价、最终的结果——有人赢，有人输，有人哭，有人笑。而林星野将在这天，得到人生中最重要的一句评价。 《星途第五人》 第五章：Jennie的考验---最终考核日。林星野凌晨四点就醒了。不是被闹钟叫醒的，是心脏把她跳醒的。她躺在床上，盯着天花板，听着赵恩熙均匀的呼吸声，把今天要做的每一件事在脑子里过了一遍。热身。化妆（虽然她不太会化，但赵恩熙说今天必须化）。换衣服。去后台。候场。上台。和Jennie一起跳舞。然后等结果。然后——她不敢想“然后”。她轻手轻脚地起了床，洗漱，穿上练功服，去了公共练习室。凌晨四点半的练习室空无一人，只有镜子里映出她苍白的脸。她开始做拉伸，一个动作一个动作地做，比平时更慢、更仔细。然后她跳了一遍。两遍。三遍。跳到第四遍的时候，天开始亮了。阳光从窗户斜照进来，落在木质的地板上，把整个房间染成淡金色。她停下来，看着地上那片光。今天是首尔入秋以来最好的天气。她不知道这是不是好兆头。但她决定把它当成好兆头。---八点整，YG主舞台后台。十名候选人被安排在一间大的待机室里，化妆师、造型师穿梭其间，忙得像打仗一样。林星野坐在角落的椅子上，闭着眼睛让化妆师在她脸上涂涂抹抹。赵恩熙坐在她旁边，不停地照镜子，嘴里念念有词——她在背自己的歌词，虽然今天不是唱歌考核，但她连伴唱部分都准备了两个版本。“紧张吗？”赵恩熙小声问。“嗯。”“我也是，”赵恩熙深吸一口气，“但Lisa昨天跟我说了一句话。”“什么话？”“她说，‘舞台是你的游乐场，不是你的审判庭。’”赵恩熙笑了笑，“我觉得她说得对。”林星野把这句话在心里默念了一遍。舞台是你的游乐场，不是你的审判庭。她睁开眼睛，看了一眼镜子里的自己。化妆师给她化了一个很淡的妆——底妆轻薄，眼线微挑，唇色是带一点橘调的粉。镜子里的她看起来比平时精神了很多，但又不像是另一个人。“好看吗？”化妆师用韩语问。林星野没听懂，但从表情上猜到了意思，点了点头。她低头看了看自己身上的衣服——一件黑色的露腰短上衣，搭配高腰工装裤，脚上是她自己的帆布鞋（Jennie说穿自己最舒服的鞋就好）。没有华丽的装饰，没有昂贵的品牌，就是最简单、最干净的舞台装。她自己觉得，挺像自己的。待机室的门开了，一个工作人员探头进来：“十点正式开始。考核顺序——第一组，Jisoo组；第二组，Rosé组；第三组，Lisa组；第四组，Jennie组。Jennie组内顺序：朴智英先，林星野后。”林星野点了点头。她在心里又默念了一遍：朴智英先，我后。先上场有先上场的好处——评委还没有疲劳，印象分容易打高。后上场也有后上场的好处——可以看对手的表现，调整自己的状态。但林星野不想想这些。她想的是：不管前面的人跳成什么样，我都要跳好自己的。---第一组、第二组、第三组。时间过得很慢，又过得很快。林星野坐在后台的监控屏前，看着前面几组候选人的表演。每一个人都拼尽全力，每一个人都有自己的光芒。有人在舞台上哭了，有人在结束后摔了话筒，有人鞠躬鞠得像是要把自己折成两半。这是他们人生中最重要的一天。她知道。因为这也是她人生中最重要的一天。“Jennie组准备。”工作人员的声音从对讲机里传出来。林星野站起来，深吸了一口气。朴智英从她身边走过，两个人对看了一眼。朴智英的眼神依然平静——平静得像一面湖，看不出任何波澜。“加油。”朴智英用韩语说。林星野听懂了，点了点头：“加油。”朴智英走向舞台入口。门关上了。林星野站在门后，听着里面传来的音乐前奏。同一首歌。同一个合作者。同一个舞台。但不同的命运。---朴智英的表演持续了大约四分钟。林星野站在门后，闭着眼睛听——音乐、脚步声、偶尔传来的衣料摩擦声。她试图从这些声音里判断朴智英跳得怎么样，但她做不到。她只知道，音乐结束的时候，台下响起了掌声。不是客套的掌声，而是真切的、热烈的、持续了好几秒的那种。林星野的胃抽了一下。工作人员推开门：“林星野，到你了。”她走进去。灯光、舞台、观众席。主舞台比她想象中大得多。灯光从头顶倾泻下来，把整个舞台照得像一个白色的岛屿。观众席是暗的，但她知道那里坐着很多人——BLACKPINK四位成员、YG制作团队、外部特邀评委。一共十七个人。十七个将决定她命运的人。Jennie站在舞台的另一侧，正看着她。她穿着和林星野风格相似的黑色舞台装，头发扎成了利落的马尾。灯光把她的轮廓勾勒得很清晰——她看起来不像一个偶像，更像一个战士。“准备好了吗？”Jennie用麦克风问。林星野点了点头，走到自己的起始位置。她站在舞台中央，脚底踩在光滑的地板上，头顶是无边的灯光。舞台是你的游乐场，不是你的审判庭。她在心里把这句话又默念了一遍。然后她看向Jennie，点了一下头。音乐响起。---前奏的钢琴声像水滴一样落下。林星野没有动。她在等——等那个让她身体想要“回应”的时刻。这不是设计好的，而是Jennie教她的：跳舞不是按节拍器做动作，而是听到音乐的那一刻，身体自然而然地想要说点什么。那一刻来了。她抬起手——不是跳舞的手，而是“想要触碰什么”的手。Jennie在同一时刻动了。两个人同时迈出第一步，方向相反，但步伐对称。那一刻，林星野忽然觉得，她们不是在“配合”，而是在“对话”。你走一步，我跟一步。你停下来，我接上去。你看着我，我看你。这不是排练过的默契，而是一种在舞台上才能产生的东西——不是信任，不是熟悉，而是两个跳舞的人在同一个音乐里找到了同一个频率。第二段副歌的时候，意外发生了。——不是失误，而是“太对了”。有一段双人配合，需要Jennie从她身后转过来，两个人背对背交替动作。排练的时候，这段她们练了不下五十遍，从来没有出过问题。但今天，在这个舞台上，在这一刻，一切都对了——音乐、灯光、情绪、力量。她们俩同时把一个过渡动作做大了半拍。半拍，不到一秒钟。但林星野在那一瞬间本能地做出了反应——她没有停下来等，也没有强行跟上，而是顺势把那个“大了的动作”变成了一个即兴的延伸，用身体画了一个弧线，稳稳地接住了下一个节拍。Jennie也做了相应的调整。整个过程不到一秒钟，但台下的评委席上，有人轻轻“啊”了一声。那是一声“我看到了”的惊叹。音乐进入尾声，最后一个音符落下。两个人同时定格。林星野的胸口剧烈起伏，汗水顺着鬓角流下来。灯光打在她脸上，刺眼得什么都看不清。她不知道自己跳得怎么样。她只知道，刚才那四分钟里，她没有一次想过“这是考核”。她只是在跳舞。和Jennie一起。全场安静了一秒。然后掌声响起。不是客套的掌声，也不是热烈的掌声——而是一种带着敬意、缓缓涌起的、像潮水一样的掌声。林星野站在舞台上，看着观众席里那些模糊的脸。她忽然想哭。但她忍住了。因为接下来，才是最煎熬的部分——等结果。---结果没有当场公布。姜制作人说，评委需要时间讨论，结果将在今晚的最终发布会上宣布。这意味着，从下午两点到晚上七点，整整五个小时的等待。林星野回到待机室的时候，赵恩熙已经回来了。她的表演排在第三组，Lisa组内第二个出场，据说跳得不错，但她的对手也很强。“你觉得你跳得怎么样？”赵恩熙问她。“不知道。”“你每次都说不知道。”“因为真的不知道。”两个人并肩坐在沙发上，谁都没有再说话。其他候选人陆陆续续回来了，待机室里的人越来越多，但没有人聊天。空气像被抽干了一样，沉闷得让人喘不过气。林星野拿出手机，看到热巴发的消息：“跳完了？”“嗯。”“怎么样？”“不知道。”“不知道就是最好的答案。如果真的跳砸了，你会知道的。”热巴顿了顿，又发了一条，“不管结果怎样，你已经比99.9%的人勇敢了。”林星野看着这条消息，喉咙发紧。她把手机扣在膝盖上，闭上眼睛。五个小时。她告诉自己：不管结果怎样，今天过后，她都不是昨天的她了。---晚上七点，YG大厅。最终发布会。十名候选人一字排开，站在舞台中央，身后是一面巨大的黑色幕布。台下坐满了媒体、工作人员，还有BLACKPINK的全体成员。Jennie坐在第一排，面无表情。林星野站在队列里，眼睛盯着自己的鞋尖。姜制作人走上台，手里拿着一个信封。全场安静。“感谢各位在过去五周里的努力，”他的声音通过麦克风传遍整个大厅，“十位候选人来自不同的国家、不同的背景，但你们有一个共同点——你们热爱舞台。”他顿了顿。“但第五人只有一个。”他拆开信封，抽出一张卡片。林星野屏住了呼吸。姜制作人看了一眼卡片上的名字，然后抬起头，目光扫过台上十个人的脸。“BLACKPINK第五位成员是——”他停了一秒。“林星野。”林星野听到了自己的名字。她以为是幻听。她转头看赵恩熙，赵恩熙已经哭了，拼命推她的胳膊。“是你！是你！是你！”台下的闪光灯劈头盖脸地砸过来。林星野站在原地，一动不动。她的脑子里只有一个念头——我赢了？我赢了。她转头看向第一排。Jennie正看着她。不是平静的审视，不是冷漠的距离。而是一种——我早就知道的笃定。Jennie点了点头，嘴角微微上扬了一下。那是林星野第一次看到Jennie笑。姜制作人走到她面前，把麦克风递给她：“说几句吧。”林星野接过麦克风，张了张嘴，发现喉咙是干的。她看着台下那些模糊的脸，想说的话有很多——谢谢YG，谢谢评委，谢谢Jennie，谢谢热巴，谢谢爸妈，谢谢沈青，谢谢赵恩熙，谢谢所有在她不知道的时候为她加油的人。但她说出来的第一句话是：“三个月前，我还是一个在成都吃麻辣烫的普通大学生。”台下有人笑了，有人在擦眼泪。她的声音在发抖，但她没有停下来。“有人问我凭什么站在这里。我想说，凭我真的真的很喜欢跳舞。”眼泪终于掉了下来。她没有擦。“还有，凭Jennie愿意教我——不是教我跳舞，而是教我怎样在舞台上说真话。”她转过头，看向Jennie。“谢谢你，Jennie欧尼。”Jennie在台下，对她比了一个大拇指。那个瞬间，林星野觉得，这五周里所有的眼泪、汗水、失眠、崩溃，都是值得的。不是因为最终赢了。而是因为，在跳完那支舞之后，她终于相信——自己是一个会发光的人。---发布会结束后，林星野被媒体团团围住。她不太会说韩语，幸好YG安排了翻译。记者们问了很多问题——“你觉得自己最大的优势是什么？”“你紧张吗？第一次和Jennie合作是什么感觉？”“你之前没有练习生经历，是怎么做到的？”她一个一个回答，尽量让自己的声音听起来不那么抖。回答到第三个问题的时候，她的手机在口袋里疯狂震动。她偷偷瞄了一眼——沈青发了一百多条消息，从“你在干嘛”到“啊啊啊啊啊”到“你上热搜了你知道不”。她没来得及回。因为她看到了另一条消息。热巴发来的，只有一句话：“我说过，你会发光的。💫”林星野看着这条消息，鼻子一酸，又想哭了。但她忍住了。因为闪光灯还在闪，记者还在问问题，她不能哭。她深吸一口气，把手机塞回口袋，抬起头，对着镜头笑了。那个笑容，后来被无数媒体转载，标题是——“BLACKPINK第五人林星野：从素人到偶像，她只用了五周。”但只有她自己知道。她用的不是五周。是二十年。---发布会结束后，人群渐渐散去。林星野一个人站在后台的走廊里，靠着墙，仰着头，看着天花板。手机又震了。赵恩熙：“我先回去了，明天见。你今晚肯定睡不着，但还是要早点睡。”她笑了笑，准备回消息。走廊的另一头，传来脚步声。Jennie走了过来。她换了一身便装，头发披着，看起来比在舞台上小了一号，像一个普通的二十几岁的女孩。“还没走？”Jennie问。“嗯，等车。”Jennie点了点头，站在她旁边，也靠在了墙上。两个人沉默了几秒。“你知道吗，”Jennie忽然开口，声音不大，像是在自言自语，“我出道的时候，也有人跟我说过一句话。”林星野转头看她。“她说，‘你站在舞台上的时候，不要想怎么做好一个偶像，就想怎么做好你自己。’”Jennie顿了顿，“我当时不太明白，现在明白了。”她转头看向林星野。“今天你在舞台上的样子，就是你自己。”林星野张了张嘴，想说谢谢，但喉咙又哽住了。Jennie伸手拍了拍她的肩膀。“明天开始，你会很忙的。”Jennie说，“专辑、练习、综艺、巡演……你会被很多人喜欢，也会被很多人骂。你要记住今天的感觉。”“什么感觉？”“站在舞台上、什么都不怕的感觉，”Jennie说，“因为以后你可能再也找不到这种感觉了。”她收回手，转身要走。“Jennie欧尼。”林星野叫她。Jennie停下来，没有回头。“谢谢你。”Jennie没有回答。但她歪了一下头，嘴角似乎又微微上扬了一下。然后她走了。高跟鞋踩在地板上，笃笃笃，越来越远。林星野站在原地，看着她的背影消失在走廊的尽头。走廊很安静。她忽然想起五周前，在上海那个粉丝见面会的后台，热巴也是这样走远的。从热巴到Jennie。从粉丝见面会到BLACKPINK的舞台。她走过了很长的一段路。但更长的路，还在前面。手机震了。车到了。林星野拿起帆布包，走向大门。推开门的瞬间，首尔的夜风扑面而来，带着初秋的凉意。她站在门口，仰头看了一眼天空。没有星星。但她知道，她的那颗星星，已经亮了。---*（第五章完）*---**下一章预告：王冠之重**成为BLACKPINK第五人的消息引爆全网。林星野从素人一夜之间变成顶流偶像，但随之而来的是铺天盖地的质疑和恶意。“空降兵”“不配”“YG疯了”……她第一次直面网暴，身心俱疲。深夜，热巴打来了那个改变一切的电话。 《星途第五人》 第六章：王冠之重---林星野一夜没睡。不是不想睡，是睡不着。手机像上了发条一样震个不停——沈青的消息、面馆群里阿姨们的消息、大学同学的问候、陌生号码的祝贺……微信变成了一个永远刷不到底的无底洞。她躺在宿舍的床上，手机屏幕的光照在天花板上，映出一片冷白色的光晕。赵恩熙已经搬走了。原本住在一起的室友，因为她的晋级、别人的淘汰，不得不分开。赵恩熙走的时候抱着她哭了五分钟，说“你一定要加油，你是我见过最努力的人”。林星野当时笑着说“我会的”。但此刻，凌晨三点，她一个人躺在空荡荡的房间里，忽然觉得那句话很重。她说的是“我会的”。但“会”是什么意思？会努力？会坚持？会红？会不辜负所有人的期待？她不知道。她只知道，天亮之后，她不再是“林星野”了。她是“BLACKPINK的林星野”。是“那个从素人变成顶流的幸运儿”。是“第五人”。这三个字，从今天起，会跟着她一辈子。手机又震了。不是微信，是短信。一个陌生号码，没有署名，只有一句话：“你不配。”林星野盯着这三个字，看了很久。然后她把短信删了，把手机关机，翻了个身，把被子蒙在头上。成都的夏天，晚上热得像蒸笼。她妈林秀兰每次看到她蒙头睡觉都要骂她：“你也不怕闷死！”她不怕闷死。她怕的是，明天醒来，这一切都是一场梦。---但明天还是来了。早晨七点，YG的公关团队接管了她的日程。经纪人姜理事——一个四十多岁的短发女人，说话像连珠炮——带着三个助理出现在宿舍门口，每人手里拿着一个文件夹。“林星野xi，今天你的行程是这样的：上午九点，官网官宣和你的个人资料页面上线。十点，YG记者会，你需要出席并回答媒体提问。下午两点，第一次团体会议，你需要见BLACKPINK其他三位成员。晚上七点，首次粉丝直播。”姜理事低头看了一眼手里的日程表，抬起头，表情严肃。“从今天起，你的每一分钟都是属于公司的。明白吗？”林星野点头。她不明白。但她知道，她不需要明白。她只需要配合。---上午九点。YG官网更新。BLACKPINK官方账号发布了五人完整体合照——Jennie、Lisa、Rosé、Jisoo，以及站在最右边的林星野。她穿着黑色的舞台装，头发扎成马尾，对着镜头微笑。配文只有一句话：“WELCOME, LIN XINGYE. THE FIFTH STAR.”评论区在十秒内破万。粉丝的反应分成三派——一派是“欢迎新成员，支持YG的决定”。一派是“观望中，先看看实力再说”。还有一派是“凭什么？她是谁？这不可能”。最后那一派的声音最大。林星野没有看评论。但她的手机开始收到更多的短信——陌生号码，各种语言，各种措辞，但核心意思只有一个：你不配。她把手机调成了勿扰模式。然后她去了记者会。---记者会在YG的大厅里举行。台下坐了上百家媒体，闪光灯像海浪一样一波接一波地涌过来。林星野坐在台上，左边是姜制作人，右边是Jennie。她穿着YG造型师给她准备的衣服——一件白色的西装外套，里面是黑色高领毛衣。她觉得这身衣服不像自己，但造型师说“这是你作为偶像的第一套战袍”。她觉得自己像穿大人衣服的小孩。记者提问开始了。前几个问题都是问姜制作人和Jennie的——“为什么选择林星野？”“选拔的标准是什么？”“BLACKPINK对第五人有什么期待？”Jennie的回答很简短：“她是一个有舞台灵魂的人。”姜制作人的回答很长，说了很多关于“天赋”“潜力”“国际化”之类的词。林星野听着，觉得他们说的那个人好像不是自己。直到第三个记者——一个戴眼镜的女记者——把话筒对准了她。“林星野xi，你之前没有任何练习生经历。你觉得你凭什么能成为BLACKPINK的成员？”全场安静了。闪光灯停了。所有人都看着她。林星野握着面前的话筒，指节发白。她脑子里闪过很多答案——凭我很努力，凭我跳得很好，凭Jennie说我懂她们的歌。但她脱口而出的是——“凭我真的真的很喜欢跳舞。”这句话说出来的那一刻，她觉得自己像个傻瓜。台下的记者们面面相觑，有人低头记笔记，有人露出了“就这？”的表情。但坐在她旁边的Jennie，忽然伸手拍了拍她的膝盖。很轻。只有一秒。然后收回来了。林星野不知道这个动作是什么意思。但她忽然不那么紧张了。记者会结束后，姜理事把她拉到一边，皱着眉头说：“以后回答问题要提前准备，不能这么……朴素。”林星野点头。但她心里在想：可是我说的是真话啊。她没说出口。因为从今天起，她说的每一句话，都会被放大、被解读、被评判。她需要学会——在不撒谎的前提下，说得体的话。这是一个她从来没有学过的技能。---下午两点，第一次团体会议。YG大楼顶层会议室。林星野走进去的时候，Jennie、Lisa、Rosé、Jisoo已经坐好了。四个人坐在会议桌的一侧，留了对面一个位置给她。那张空椅子像一把审判椅。“坐吧。”Jisoo用韩语说，指了指那把椅子。林星野走过去，坐下来。她的对面是BLACKPINK。这个画面她以前只在屏幕上看过——四个人坐在一起，气场强大得像一座山。而现在，她坐在他们对面的那把椅子上，要被他们“审视”。虽然是队友，但她知道，在今天之前，她们只是“打过照面的前辈和晚辈”。今天之后，她们是“队友”。但队友这个词，不是一天就能变成真的。“你会说韩语吗？”Rosé用英文问。“一点点。”林星野用韩语回答。“没关系，我英文也可以。”Rosé笑了，声音很温柔，“我跟你说英文，你慢慢学韩语。”Lisa坐在Rosé旁边，一直在看林星野。她的眼神很直接，不是审视，而是好奇。“我看了你选拔时的视频，”Lisa用英文说，语速很快，“你跳舞的时候，有些动作的处理方式和我很像。你经常看我的视频？”林星野点头：“你的每一支直拍我都看过。”Lisa笑了，露出一排整齐的白牙：“难怪。”Jisoo是最后一个开口的。她一直靠在椅背上，手里转着一支笔，表情懒洋洋的，像是在看一出跟自己无关的戏。“你很紧张？”Jisoo问。“嗯。”“不要紧张，”Jisoo换了个姿势坐直了一点，“我们不会吃掉你的。”Jennie一直没说话，坐在最边上，低头看手机。听到Jisoo的话，她抬起头，瞥了林星野一眼。“今天不是批斗会，”Jennie说，“是讨论后续的安排。你新加入，很多东西要从头学。语言、礼仪、舞台配合、综艺感……你要补的东西很多。”她顿了顿。“我们会帮你。但你要自己跟上来。”林星野点头。她在桌子下面攥紧了拳头。跟上来。好。---但“跟上来”比想象中难得多。第一次团体练舞，林星野就出事了。那是BLACKPINK的一首老歌——《Kill This Love》。她翻跳过无数次，对每一个动作都烂熟于心。但“翻跳”和“和原版一起跳”是两回事。走位。这是她最大的敌人。BLACKPINK的编舞里有大量的交叉走位——你进我退，你左我右。一个人走错一步，整个队形就会乱。而她，在第三遍排练的时候，走错了一步。不是大错，只是一个转向的角度偏了五度。但就是这五度，让她在下一个八拍里，差点撞上了Jennie。她猛地刹住，身体失去平衡，踉跄了一步。Jennie也停下来了。整个舞蹈室安静了。编舞老师皱着眉头走过来：“你的走位错了。从副歌前那段再来一遍。”林星野点头，回到自己的位置。但她的脑子里一直在回放刚才那一幕——如果她没有刹住，就会撞上Jennie。如果撞上了，Jennie可能会受伤。如果Jennie受伤了——“停。”编舞老师又喊了。她又走错了。这一次，她的手指差点戳到Jisoo的眼睛。Jisoo往后闪了一下，脸上的表情从慵懒变成了严肃。“你太紧张了，”Jisoo说，“放松一点。”林星野想说自己已经很努力在放松了，但她说不出口。因为她知道，问题不在“紧张”。在于她太想证明自己了。她太想“跟上来”，所以每一个动作都做得太满，每一步都走得太快。她不是在跳舞，而是在“跑”。跑步的人，是容易摔倒的。排练结束后，所有人都走了。林星野一个人留在舞蹈室里，对着镜子，一遍一遍地练走位。她不再“跑”了。她把速度放慢，一个八拍一个八拍地过，像拆解一台精密的机器一样，把每一个动作、每一个角度、每一条走位路线都拆开来看。为什么这里要走三步？因为要走完这三步才能和Jisoo交叉。为什么这里要转向45度？因为45度是让镜头能同时拍到她和Jennie的最佳角度。她把每一个“为什么”都弄明白了。然后她开始一遍一遍地练。十遍。五十遍。一百遍。直到动作不再是“记住的”，而是“长在身体里的”。凌晨一点，她终于停下来，坐在地板上，浑身是汗。手机亮了。热巴：“今天怎么样？”她看着这条消息，手指悬在键盘上方。她有很多话想说——累、很难、我觉得我不够好、我怕拖累她们。但她一个字都没有打。她回了两个字：“还行。”热巴过了几秒，回了一个字：“骗。”林星野看着那个“骗”字，忽然笑了。她不知道热巴是怎么看出来的，但热巴总是能看出来。热巴又发了一条：“累了就早点睡。明天又是新的一天。”林星野回：“嗯。”她站起来，关灯，走出舞蹈室。走廊很安静，她的脚步声在空荡荡的大楼里回响。她忽然想起今天排练时的那个失误——差点撞上Jennie的那一瞬间，Jennie的表情。不是生气，不是责备。而是一种——“我等你调整好”的耐心。她不知道这是不是自己的错觉。但她决定相信这是真的。---第三天、第四天、第五天。林星野每天的训练时长从八小时变成了十二小时，又从十二小时变成了十四小时。早上六点起床，学韩语。上午练舞。下午练声乐。晚上学礼仪和综艺课。半夜再练两小时舞。她的膝盖肿了，手腕扭了，脚底磨出了水泡——水泡破了又结痂，结痂又磨破。但她没有喊过一句疼。不是因为坚强，是因为她知道，没有人会因为她喊疼就让她休息。在这个行业里，疼是常态。不是常态的事情是——她开始收到更多的恶意。“空降兵”“走后门”“整容怪”“YG的耻辱”。这些词像钉子一样，一根一根地钉进她的手机屏幕里。她告诉自己不要看。但她控制不住。每次打开社交媒体，她都像在给自己上刑。她知道这些评论不是真的，但它们还是能让她疼。第六天晚上，她终于崩溃了。不是因为一条恶评，而是因为一条“善意”的评论。一个粉丝在超话里发了一段话：“我相信林星野会进步的。她现在还不够好，但给她时间，她会证明自己的。”“还不够好。”这三个字，比“你不配”更让她疼。因为“你不配”是假的。但“还不够好”是真的。她确实还不够好。她现在跳的每一支舞都比不上Lisa的爆发力，她的表情管理比不上Jennie的松弛感，她的声乐比不上Rosé的厚度，她的综艺感比不上Jisoo的天然。她是五人里最弱的那一个。这是事实。她可以骗自己说“我在进步”，但进步的速度，赶不上外界的期待。她蹲在宿舍的浴室里，水从花洒里冲下来，盖住了她的哭声。她哭得很小声。因为她不想让任何人知道。---但有人还是知道了。凌晨一点，手机响了。不是微信，是电话。来电显示：迪丽热巴。林星野犹豫了一下，接了。“你在干嘛？”热巴的声音从听筒里传出来，带着一种刻意的轻松。“躺着。”林星野说。她的声音哑了，哭哑的。热巴沉默了两秒。“你哭了。”不是疑问句，是陈述句。“没有。”林星野撒谎。“你的声音像被砂纸磨过，还跟我说没有，”热巴的声音忽然软了下来，“小朋友，你跟我还装什么？”林星野没说话。热巴也没说话。电话里只有两个人呼吸的声音。过了大概十秒钟，热巴说了一句让林星野永远忘不了的话：“你知道吗，我拍第一部戏的时候，导演当着全组人的面说我‘不会演戏，不如回家种田’。我那天晚上躲在酒店的厕所里哭了两个小时，哭到妆全花了，第二天眼睛肿得像核桃。”林星野听着，没有说话。“但我第二天还是去了片场。不是因为我不怕了，是因为我知道，如果我不去，就真的‘不会演戏’了。”热巴顿了顿。“你现在也是这样。你觉得自己不够好，那是因为你站在了更高的地方。以前你在成都的小舞台上，你是最好的。现在你站在BLACKPINK的舞台上，你是最弱的。这不是你变差了，是你的参照系变了。”林星野的眼泪又掉了下来。“那我怎么办？”她的声音很小，小到像在自言自语。“继续练，”热巴说，“不是因为你练了就会变强，而是因为——你没有退路了。”电话那头传来一声轻响，像是热巴在喝什么东西。“还有，”热巴的声音又轻松起来了，“你要是实在难受，就想想我。想想我在剧组里被导演骂了三百遍还坚强地活着，你就觉得自己还行。”林星野被这句话逗笑了。虽然脸上还挂着眼泪，但嘴角确实弯了一下。“笑了就好，”热巴说，“去睡吧。明天还要练舞呢。”“嗯。”“晚安，小朋友。”“晚安，姐姐。”电话挂了。林星野把手机放在枕头边上，翻了个身。窗外的首尔，夜色很深。她忽然想起热巴说的那句话——“你没有退路了。”不是没有退路。是退回去的那条路，她不想走。所以她只能往前走。---第七天。早上六点，林星野走进舞蹈室的时候，有人已经在里面了。Jennie。她穿着练功服，正对着镜子做拉伸。看到林星野进来，她点了点头，算是打了招呼。“今天练什么？”Jennie问。林星野愣了一下——这是Jennie第一次主动问她“今天练什么”。“《How You Like That》的走位，我还是不太稳。”Jennie站起来，走到音响旁边。“来，我跟你一起练。”那一整天，Jennie陪她练了六个小时。不是指导，是“一起练”——就像两个舞者在同一个音乐里对话。没有老师的姿态，没有前辈的距离，就是两个人都想跳舞，所以一起跳。练到最后一遍的时候，林星野忽然发现——她的走位不再出错了。不是因为Jennie带得好，而是因为她在这一遍又一遍的重复里，终于把那些“为什么”变成了“身体知道”。停下来的时候，她看着镜子里的自己，忽然觉得——镜子里的那个人，看起来不再像一个“外来者”了。她看起来像这个团队的一部分。Jennie从她身边走过，拍了拍她的肩膀。“你今天进步了。”然后她走了。林星野站在镜子前，看着Jennie的背影，心里忽然涌起一种奇怪的情绪。不是感激，不是激动。而是一种——归属感。虽然还很小，小到像一根头发丝一样细。但它在那里。从今天起，她是BLACKPINK的林星野。不是因为她被选上了，而是因为——她开始相信自己是了。---*（第六章完）*---**下一章预告：我们，五个人**集训进入第二个月，林星野和成员们的关系从“同事”变成了“家人”。Jisoo教她说韩语梗，Lisa带她吃炒年糕，Rosé陪她练声乐到深夜。而Jennie，在一次深夜阳台上，和她说了那句改变一切的话。同时，新专辑的录制也在紧张进行中。 《星途第五人》 第七章：我们，五个人---集训进入第二个月的时候，林星野终于学会了一件事——在YG大楼里不迷路。这听起来很简单，但对一个方向感为零、韩语只会基本用语的人来说，在这栋地上六层、地下三层、走廊像迷宫一样的大楼里找到正确的舞蹈室，曾经是每天最大的挑战。现在她可以闭着眼睛从宿舍走到练习室、从练习室走到食堂、从食堂走到录音室。这不是因为她变聪明了。而是因为她在这条路上，已经走了上千遍。早上六点，她推开练习室的门。灯已经亮了。Jisoo坐在地板上，面前摆着三个便当盒，正用筷子夹一块煎蛋。“早。”Jisoo用韩语说，嘴里还嚼着东西。“早。”林星野用韩语回。这是她们之间固定的对话模式——Jisoo说韩语，林星野用韩语回最简单的词，然后两个人各自干各自的事。但今天有点不一样。Jisoo拍了拍身边的空地：“吃了吗？”林星野摇头。Jisoo把一个便当盒推到她面前：“吃。”林星野低头看了一眼——米饭、煎蛋、泡菜、烤牛肉。不是YG食堂的早餐，而是韩式家常便当，装在一个粉色的保温袋里，还冒着热气。“你做的？”林星野用英文问。“我妈做的，”Jisoo笑了，“她听说我有了新队友，说‘给那个中国孩子也带一份’。”林星野接过便当盒，不知道该说什么。“吃吧，凉了就不好吃了。”Jisoo已经开始吃自己那份了，吃相很斯文，但速度很快。林星野拿起筷子，夹了一块牛肉放进嘴里。牛肉很嫩，酱料是甜的，带着一点点芝麻油的味道。她忽然想起成都面馆里，林秀兰做的红烧牛肉面。鼻子一酸。她使劲忍住，低头扒了一大口饭。Jisoo在旁边瞥了她一眼，没说什么，只是把自己的泡菜碟往她那边推了推。从那天起，Jisoo每天早上都会多带一份便当。林星野问过她“这样不会太麻烦吗”，Jisoo说“我妈现在做两人份已经习惯了，你不吃她反而会担心”。林星野没再推辞。但她开始每天早上提前十分钟到练习室，把地板擦干净、把音响调试好、把水瓶摆整齐。这是她唯一能做的事。用她自己的方式，说“谢谢”。---Lisa是四个人里最先打破“前辈后辈”边界的人。不是因为她不讲礼貌，而是因为她对“跳舞”这件事有一种天然的平等感——在舞蹈面前，所有人都是平等的。你跳得好，我就尊重你。你跳得不好，我就帮你跳好。没有中间地带。那天下午，练习室里只有她们两个人。林星野在练一段solo——不是BLACKPINK的歌，是她自己编的一段，融合了中国舞的身韵和Hip-hop的律动。她没打算给别人看，只是觉得在正式排练之外，需要一些“自己的时间”。她跳完的时候，身后传来掌声。她转头，Lisa靠在门框上，不知道已经看了多久。“那是什么？”Lisa用英文问，眼睛亮亮的。“我自己编的。”“再跳一遍。”林星野犹豫了一下，跳了第二遍。跳完之后，Lisa走到她面前，用手比划了一个动作：“这个地方，你的手臂可以再延伸一点。中国舞的韵味在这里——不是手在动，是气在动。”林星野愣住了。因为“气在动”这个概念，是她在中国舞课上老师反复强调的。她从来没有跟Lisa提过，但Lisa看出来了。“你怎么知道？”林星野问。Lisa笑了：“因为我学过。”她没细说，但林星野后来才知道，Lisa在出道前专门学过中国舞，为的是增强身体的柔韧性和表现力。那天下午，两个人没有排练BLACKPINK的舞。她们在练习室里“玩”了三个小时——你编一段，我编一段，互相学，互相改。没有竞争，没有考核，没有“你应该怎样”。就是跳舞。纯粹的、让人开心的跳舞。停下来的时候，两个人坐在地板上，背靠着镜子，满头大汗。Lisa忽然说了一句：“你让我想起刚来韩国的我。”林星野转头看她。“我十四岁从泰国来的时候，韩语一句都不会，谁都不认识。每天除了练舞就是哭，哭着练、练着哭。”Lisa顿了顿，“但我没有回去。因为我知道，回去了我会后悔一辈子。”她看着林星野，眼神很认真。“你也不要回去。”林星野点头。她没告诉Lisa，她从来没想过“回去”这个选项。因为回去的那条路，比留下来更难走。---Rosé是四个人里最安静的。不是冷漠，而是一种——需要时间才能靠近的安静。她不像Jisoo那样主动分享便当，也不像Lisa那样热情地拉着你跳舞。她更像一扇门——门开着，但你要自己走进去。林星野第一次走进那扇门，是因为声乐课。她的声乐基础很差。不是跑调，而是——不会用气息。跳舞的时候她的体能没问题，但一唱歌，气息就浮上来，声音又薄又飘，像一张随时会被风吹走的纸。声乐老师是YG最严格的老太太，姓金，教过无数偶像。她对林星野的评价只有一句话：“你的声音里没有根。”林星野不知道什么是“根”。她问金老师，金老师说“你自己去找”。她问了三个声乐助教，每个人给的答案都不一样——有人说“根是丹田的力量”，有人说“根是情感的支点”，有人说“根是自信”。她越听越糊涂。那天晚上，她在练习室里对着镜子练发声，练到嗓子哑了，还是没有找到“根”。Rosé路过门口，听到她哑着嗓子在练“啊——”，停下来了。“你这样会伤声带的。”Rosé走进来，手里拿着一瓶蜂蜜水。林星野接过蜂蜜水，喝了一口，甜得发腻。“声乐课很难吗？”Rosé问。林星野苦笑：“老师说我声音里没有根。我不知道什么是根。”Rosé沉默了几秒，然后说了一句话：“根不是技术，是故事。你唱歌的时候，脑子里要有画面。你在说什么？你在对谁说？你为什么说？”她拿起手机，放了一段伴奏——不是BLACKPINK的歌，是一首很慢的英文歌，叫《Only Love Can Break Your Heart》。“你试试看，”Rosé说，“不要想技巧，就想一件事——你上一次心碎是什么时候？”林星野闭上眼睛。上一次心碎。她想到了很多事——高考成绩出来那天，知道自己去不了北舞，躲在面馆的厕所里哭了半个小时。第一次 audition 被刷下来，一个人在练功房里坐到天亮。还有更早的，小时候被同学说“你跳舞跳得再好又怎样，你爸妈还不是卖面的”。她把那些画面放在脑子里，然后开口唱。声音不大，甚至有些颤抖。但她唱完之后，睁开眼，看到Rosé在笑。“你找到了，”Rosé说，“刚才那一句，就是有根的。”林星野不知道Rosé说的是不是真的。但从那天起，她每次唱歌之前，都会先闭上眼睛，在脑子里放一个画面。画面里的人有时候是小时候的自己，有时候是林秀兰，有时候是热巴。她为那些人唱歌。声音就不再飘了。---Jennie是最后一道门。不是因为她难接近，而是因为——林星野怕她。不是那种“害怕被骂”的怕，而是一种更复杂的、说不清楚的东西。Jennie太强了。不是技术上的强——技术上Lisa也很强，但Lisa的强是“我能做到”的强，带着一种让人想追赶的冲动。而Jennie的强是“我就是这样”的强，带着一种让人想靠近、又不敢靠近的距离感。她像一座山。你可以仰慕山，但你很难和山做朋友。转折发生在集训第五周的一个晚上。那天晚上，林星野在练习室里练到凌晨，准备走的时候，发现走廊尽头的阳台门开着。她走过去，想关门，却发现Jennie站在那里。Jennie穿着宽松的卫衣，头发散着，手里拿着一杯冒着热气的咖啡，正看着远处的首尔夜景。听到脚步声，她回头看了一眼。“还没走？”“正要走。”Jennie点了点头，转回去继续看夜景。林星野本来应该走的。但她的脚没有动。她站在Jennie旁边，也看向远处。首尔的夜景很漂亮——密密麻麻的灯光，像一片发光的海。汉江在远处蜿蜒，把城市分成两半。两个人沉默了很久。然后Jennie忽然开口了。“你知道我为什么对你那么严格吗？”林星野摇头。“因为我见过太多说‘我热爱舞台’的人，”Jennie的声音很轻，像在自言自语，“他们说她热爱舞台，说她愿意为舞台付出一切。但真正开始训练之后，吃不了苦的、受不了骂的、扛不住压力的，一个一个都走了。”她顿了顿。“我想知道你是不是真的。”林星野没有说话。“所以我对你严格，不是不喜欢你，”Jennie转头看她，表情比平时柔和了很多，“是想知道你能不能扛住。”“那我扛住了吗？”林星野问。Jennie看了她两秒，嘴角微微弯了一下。“你凌晨四点在练习室的监控视频，我看过。”林星野愣住了。监控视频？“不是监视你，”Jennie补了一句，“是安保系统录的，我偶尔会看一眼。你在那个破旧的公共练习室里，一遍一遍地跳同一支舞，跳到天亮。那个画面我看了很多遍。”她转回去，继续看夜景。“你知道吗，我当练习生的时候，也经常在那个房间里练到半夜。地板很硬，镜子有裂缝，但那个房间很安静。安静到你能听见自己的呼吸。”她顿了顿。“你跳舞的时候，呼吸是对的。”这是Jennie第二次说这句话。第一次是在排练的时候，带着老师的审视。第二次是在这个阳台上，凌晨，没有别人——像朋友之间的分享。林星野忽然觉得，Jennie不是一座山。她也是一条河。只是她流得很深，深到外面的人看不见。“谢谢你，Jennie欧尼。”林星野说。Jennie没有回答。她举起咖啡杯，喝了一口，然后说了一句让林星野没想到的话：“以后叫我Jendeukie就好。”Jendeukie。那是Jennie的昵称，只有最亲近的人才会叫。林星野张了张嘴，试着叫了一声：“Jendeukie欧尼。”Jennie“嗯”了一声，脸上没有表情，但她握着咖啡杯的手指微微收紧了一点。林星野看到了。她没有说破。她只是把这个画面存进了脑子里，和热巴的麻辣烫照片、Lisa的舞蹈示范、Jisoo的便当盒、Rosé的蜂蜜水放在一起。存进了那个叫“星星”的文件夹里。---新专辑的录音开始了。这是林星野第一次进专业录音棚。录音棚不大，隔音墙是深蓝色的，头顶的灯发出暖黄色的光。麦克风立在中间，像一棵等待被浇水的植物。她要录的第一首歌，不是主打，而是一首收录曲。她的部分只有四句。四句。她在心里反复练习了上千遍的四句。Rosé坐在控制室里，透过玻璃看着她，手里拿着水瓶，时不时对她比一个大拇指。“准备好了吗？”录音师的声音从耳机里传出来。林星野深吸一口气，点了点头。音乐响起。她闭上眼睛，脑子里放了一个画面——小时候，在面馆的角落里，对着电视机跳舞的自己。她对那个小女孩说：你看，我走到这里了。然后她开口唱了。第一句，声音有点紧。第二句，松下来了。第三句，气息稳了。第四句——她睁开眼，看着玻璃外面的Rosé。Rosé正在笑，笑得眼睛弯弯的，像两道月牙。录音师的声音从耳机里传出来：“第四句，再来一遍，刚才那个情感很好，但最后一个音可以再长一点。”林星野点头。第四句，再来一遍。这一次，她把最后一个音拖长了半拍。不是为了技术，而是因为——她想让那句话被听见。录音结束的时候，Rosé走进来，递给她一瓶水。“你进步了。”“真的吗？”“真的，”Rosé认真地看着她，“你不再是‘会唱歌的舞者’了。你现在是‘会唱歌的偶像’。”林星野不知道这两者有什么区别。但她知道，Rosé不会骗她。---录音结束后，五个人第一次聚在Jisoo的宿舍里吃外卖。Jisoo点了炸鸡、炒年糕 林星野使劲眨了眨眼睛，把眼泪逼回去。“你怎么进来的？这是后台。”“你猜？”热巴晃了晃手里的工作证——上面贴着林星野的照片。是她第一次来韩国时拍的证件照，头发扎着马尾，表情严肃得像在拍身份证。“你偷我的工作证？！”“我借的，”热巴把工作证收进口袋，“你经纪人给我的。她说‘你是她姐姐，应该来看看’。”林星野愣了一下。姜理事什么时候变得这么通情达理了？热巴像是看穿了她的疑问，压低声音说：“我跟她说，你不让我进来，我就发微博说YG虐待艺人。”“……你骗她的吧？”“你觉得呢？”热巴眨了眨眼。林星野笑了。笑得停不下来。热巴看着她笑，也跟着笑了。两个人站在后台的走廊里，笑得像两个没心没肺的小孩。“林星野！还有两分钟上场！”工作人员的声音从远处传来。林星野收了笑，深吸一口气。“去吧，”热巴说，“我在下面看着你。”“你还会在吗？”林星野问。“我又不走，我买了全场的票，”热巴拍了拍口袋，“VIP席位，最贵的。”林星野看着她，想说谢谢，想说你能来真好，想说这半年来每次快撑不住的时候都是你把我拉回来的。但她什么都没说出口。因为她知道，这些话不需要说。热巴都知道。“姐姐，”林星野说，“看完演唱会别走。我请你吃夜宵。”“什么夜宵？”“你猜。”林星野转身跑向舞台入口。跑了几步，她停下来，回头看了一眼。热巴还站在那里，靠着墙，对她比了一个大拇指。那个手势，和Jennie在决赛夜对她比的一模一样。林星野笑了，转过头，跑进了灯光里。---最后一套服装，五个人换上巡演限定版舞台装——黑色亮片短裙，银色腰带，高跟长靴。林星野站在镜子前，看着自己。镜子里的那个人，不再是半年前那个穿着白色T恤和帆布鞋的素人女孩。她化了精致的妆，穿着昂贵的衣服，站在全世界最大的舞台上。但她的眼睛没有变。还是那双在成都天台上录视频时的眼睛——亮亮的，不服输的，看到舞台就会发光的眼睛。“最后两首了，”Jisoo走过来，“《Forever Young》和《As If It‘s Your Last》。大家加油。”“加油！”五个人齐声喊。升降台再次上升。灯光再次亮起。四万五千人再次尖叫。林星野站在舞台中央，看着台下那片粉色的海。她忽然想起一个画面——两年前，她在成都的宿舍里，沈青指着手机屏幕上的BLACKPINK演唱会视频说：“你什么时候也能站在上面啊？”她当时笑着说：“下辈子吧。”下辈子没有来。但这辈子来了。---演唱会结束。五个人在后台抱成一团。Jisoo在哭，Rosé在哭，Lisa红着眼眶但一直在笑，Jennie眼眶也红了。林星野没哭，她已经哭够了，今天的眼泪配额在solo舞台上就用完了。“我们做到了，”Jisoo用韩语说，声音哑哑的，“四万五千人。我们做到了。”“这才第一站，”Jennie冷静地补了一句，“后面还有三十几站。”Jisoo瞪了她一眼：“你能不能别这么扫兴？”Jennie耸了耸肩，嘴角弯了一下。工作人员涌进来，递毛巾、递水、递外套。姜理事站在门口，手里拿着对讲机，难得地露出了一丝笑容。“今天很好。回去好好休息，明天飞东京。”众人散去。林星野没有走。她站在后台的走廊里，等着。过了大概十分钟，热巴从观众出口的方向走了过来。她戴着帽子和口罩，但在空荡荡的走廊里，还是被林星野一眼认出来了。“你怎么还穿着舞台装？”热巴看着她身上的亮片裙子，“不冷吗？”“等一下换。”林星野说，“你饿不饿？”“饿。飞机上没吃东西，就等着你这顿。”林星野从帆布包里掏出一个保温袋。粉色的，保温袋上印着小熊图案——那是Jisoo的妈妈用来装便当的袋子。她打开保温袋，从里面拿出一碗——酸辣粉。速食的，带着塑料包装，热气把盖子顶得鼓鼓的。热巴看着那碗酸辣粉，愣了两秒钟。“你……从哪里弄来的？”“沈青寄来的，”林星野说，“她说你想吃的时候随时都有。”热巴接过酸辣粉，揭开盖子。酸辣的味道在走廊里弥漫开来，混着后台的香水味和发胶味，有一种奇怪的和谐。“没有筷子。”热巴说。林星野从包里掏出两双一次性筷子，递给她一双。两个人靠着走廊的墙，蹲在地上，吃酸辣粉。热巴吃得很认真，一点声音都没有。林星野也吃得很认真，但她吃到一半的时候，忽然停下来，看着热巴。“怎么了？”热巴嘴里还嚼着粉丝，含糊不清地问。“姐姐。”“嗯。”“你说我是不是在做梦？”热巴咽下嘴里的粉丝，看了她一眼。“梦什么梦，快吃，粉丝要坨了。”林星野笑了，低头继续吃。酸辣粉的汤很烫，辣得她鼻子发酸。但她没有停下来。热巴吃完了，把碗放在地上，从口袋里掏出纸巾，递给林星野一张，自己拿了一张擦嘴。“你今天在舞台上说的那段话，”热巴说，“我听到了。”林星野转头看她。“你说，‘有一个姐姐今天来了，她是我追的第一颗星’。”热巴顿了顿，“我在台下哭得隐形眼镜都掉了。”“真的假的？”“真的。旁边坐的人都在看我，以为我失恋了。”热巴笑了，笑着笑着眼眶红了。林星野看着她红了的眼眶，自己的眼眶也热了。“姐姐。”“嗯。”“谢谢你。”“谢什么？”“谢谢你那天加我微信。”热巴看着她，沉默了几秒，然后伸出手，在她头上轻轻拍了一下。“谢什么谢，”热巴说，“是你自己走过来的。我只是开了个门。”林星野摇了摇头。不是的。热巴开的不是门。她开的是窗。是一扇让阳光照进来的窗。在她还不知道自己会发光的时候，热巴就已经看到了那束光。走廊尽头传来脚步声。Lisa探出头来：“星野——你在干嘛？我们要去吃烤肉，你去不去？”她看到了蹲在地上的林星野和热巴，看到了地上的酸辣粉碗，看到了两个人红红的眼眶。“你们……在干嘛？”Lisa的表情从好奇变成了困惑。“吃夜宵。”林星野说。Lisa看了一眼酸辣粉的包装袋，眼睛亮了：“这是中国的那个——辣的——”“酸辣粉。”热巴用中文说。Lisa没听懂，但她的鼻子已经替她做了决定。她蹲下来，看着林星野：“给我吃一口。”林星野把剩下的半碗递给她。Lisa吃了一口，表情从期待变成了震惊，从震惊变成了狂喜。“这个太好吃了！这是什么？！为什么我从来没有吃过？！”Jisoo的声音从走廊更深处传来：“你们在吃什么？我也要！”Rosé：“还有我。”Jennie：“……我不吃辣。”但她也走过来了。走廊里，五个人加上热巴，蹲成一圈，分一碗酸辣粉。Lisa被辣得直吸气，但筷子不停。Jisoo一边吃一边说“这个比炒年糕好吃”。Rosé小口小口地吃，被辣得脸都红了。Jennie最后还是没有忍住，尝了一口，然后默默地吃了第二口。热巴蹲在角落里，看着这群人抢一碗酸辣粉，笑得眼睛弯成月牙。林星野看着她们。这个画面，她会记一辈子。不是演唱会上的四万五千人，不是一位奖杯，不是热搜第一。而是这个——凌晨的首尔，后台的走廊，五个人加一个姐姐，蹲在地上抢一碗酸辣粉。这才是她走到这里的原因。不是因为舞台有多大，不是因为掌声有多响，而是因为有这些人。有热巴在她最迷茫的时候拉了她一把，有Jennie在她最软弱的时候推了她一把，有Lisa、Jisoo、Rosé在她最孤单的时候接住了她。她不是一个人走到这里的。从来都不是。---凌晨两点，所有人都走了。林星野一个人站在后台的走廊里，靠着墙。她的手机震了。热巴发来一条消息：“我先回酒店了。明天你飞东京，我飞北京。下次见面不知道什么时候。但我会一直看你的。小朋友，晚安。✨”林星野看着这条消息，打了几个字，又删掉了。反复好几次之后，她只回了一句：“晚安，姐姐。”她锁上手机，低头看了一眼手腕上的那条手链。热巴送的，戴了半年，从来没有取下来过。她走到走廊的尽头，推开门。首尔的夜风扑面而来，带着初秋的凉意。体育场的灯光已经灭了，观众席空无一人。舞台在黑暗中沉默着，像一个刚刚讲完故事的老人。林星野站在门口，仰头看着天空。今晚首尔的天气很好，没有云，星星很亮。她找到了北斗七星，找到了北极星，找到了那些她从小看到大的星座。然后她低下头，看着自己的影子。影子在路灯下拉得很长，长到像是可以够到天边。她从帆布包里拿出手机，打开相册，翻到最前面。第一张照片是热巴发过的麻辣烫。第二张是热巴的小熊转圈表情包。第三张是“小朋友好”的截图。然后是天台上的夕阳、首尔的练习室、Jennie的侧脸、五个人的炸鸡、一位奖杯、四万五千人的粉色海洋。她翻到最后一张——刚才拍的，五个人蹲在走廊里抢酸辣粉。所有人的脸都是糊的，只有酸辣粉是清晰的。她笑着把手机收起来，背好帆布包，走进了首尔的夜色里。远处，城市的灯光一盏一盏地亮着，像地上的星星。而她是这些星星中的一颗。不大，不亮，但她在那里。她会一直在那里。因为从成都到首尔，从麻辣烫到星辰大海，她走了很远很远的路。但这条路，还没有走完。她还要继续走。

  }
  var sel = document.getElementById('chapterSelect');
  sel.innerHTML = '';
  for (var j = 0; j < chapters.length; j++) {
    var opt = document.createElement('option');
    opt.value = j; opt.textContent = chapters[j].title;
    sel.appendChild(opt);
  }
}

function renderChapter() {
  if (!chapters.length) return;
  var ch = chapters[currentChapter];
  document.getElementById('chapterTitle').textContent = ch.title;
  document.getElementById('chapterContent').innerHTML =
    '<p>' + ch.content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
  document.getElementById('chapterSelect').value = currentChapter;
  document.getElementById('chIndicator').textContent = (currentChapter+1) + ' / ' + chapters.length;
  document.getElementById('prevBtn').disabled = currentChapter === 0;
  document.getElementById('nextBtn').disabled = currentChapter === chapters.length - 1;
  document.getElementById('readingArea').scrollIntoView({ behavior:'smooth', block:'start' });
  try { localStorage.setItem('readPos_'+bookId, currentChapter); } catch(e){}
}

function jumpToChapter(idx) { currentChapter = parseInt(idx); renderChapter(); }
function prevChapter() { if (currentChapter>0) { currentChapter--; renderChapter(); } }
function nextChapter() { if (currentChapter<chapters.length-1) { currentChapter++; renderChapter(); } }

function changeFontSize(delta) {
  currentFontSize = Math.max(14, Math.min(24, currentFontSize+delta));
  document.getElementById('readingArea').style.fontSize = currentFontSize+'px';
  document.getElementById('fsLabel').textContent = currentFontSize+'px';
  try { localStorage.setItem('readFontSize', currentFontSize); } catch(e){}
}

function toggleEyeMode() {
  eyeMode = !eyeMode;
  document.body.classList.toggle('eye-mode', eyeMode);
  document.getElementById('eyeBtn').classList.toggle('active', eyeMode);
  document.getElementById('eyeBtn').textContent = eyeMode ? '🌿 护眼中' : '🌿 护眼模式';
  try { localStorage.setItem('readEyeMode', eyeMode?'1':'0'); } catch(e){}
}

function goBack() { location.href = '/books.html'; }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextChapter(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevChapter(); }
});

function init() {
  parseNovel();
  try {
    var saved = localStorage.getItem('readPos_'+bookId);
    if (saved !== null) currentChapter = parseInt(saved);
    var savedFS = localStorage.getItem('readFontSize');
    if (savedFS !== null) currentFontSize = parseInt(savedFS);
    var savedEye = localStorage.getItem('readEyeMode');
    if (savedEye === '1') eyeMode = true;
  } catch(e){}
  document.getElementById('readingArea').style.fontSize = currentFontSize+'px';
  document.getElementById('fsLabel').textContent = currentFontSize+'px';
  if (eyeMode) {
    document.body.classList.add('eye-mode');
    document.getElementById('eyeBtn').classList.add('active');
    document.getElementById('eyeBtn').textContent = '🌿 护眼中';
  }
  renderChapter();
}

init();
</script>
</body>
</html>
