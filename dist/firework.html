<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎆 星光璀璨</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; width:100vw; height:100vh; font-family:'Microsoft YaHei',sans-serif; }
  canvas { position:fixed; top:0; left:0; }
  .close-btn {
    position:fixed; top:20px; right:20px; z-index:10;
    width:50px; height:50px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.5);
    background:rgba(0,0,0,0.4); backdrop-filter:blur(10px);
    color:#fff; font-size:24px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.3s;
  }
  .close-btn:hover { background:rgba(255,255,255,0.2); border-color:#fff; transform:scale(1.1); }
  .music-btn {
    position:fixed; top:20px; right:80px; z-index:10;
    width:50px; height:50px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.5);
    background:rgba(0,0,0,0.4); backdrop-filter:blur(10px);
    color:#fff; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.3s;
  }
  .music-btn:hover { background:rgba(255,255,255,0.2); border-color:#fff; transform:scale(1.1); }
  .music-btn.playing { border-color:#FFD700; box-shadow:0 0 12px rgba(255,215,0,0.4); }
  .hint {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:10;
    color:rgba(255,255,255,0.4); font-size:14px; letter-spacing:0.2em; pointer-events:none;
  }
  /* 祝福文字容器 */
  .bless-wrap {
    position:fixed; z-index:15; pointer-events:none;
    display:flex; gap:0.15em;
    transform:translate(-50%,-50%);
  }
  /* 单个字 */
  .bless-char {
    font-weight:900;
    text-shadow:0 0 15px currentColor, 0 0 40px currentColor;
    animation:charPop 3s ease-out forwards;
    will-change:transform,opacity;
    opacity:0;
  }
  @keyframes charPop {
    0%   { transform:translate(-50%,-50%) scale(0.2) translateY(20px); opacity:0; }
    12%  { transform:translate(-50%,-50%) scale(1.3) translateY(-5px); opacity:1; }
    25%  { transform:translate(-50%,-50%) scale(1) translateY(0); opacity:1; }
    65%  { transform:translate(-50%,-50%) scale(1.05); opacity:0.6; }
    100% { transform:translate(-50%,-50%) scale(1.5) translateY(-20px); opacity:0; }
  }
</style>
</head>
<body>
<canvas id="fw"></canvas>
<button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="音乐">🎵</button>
<button class="close-btn" onclick="goBack()">✕</button>
<audio id="bgMusic" src="./blessing-song.mp3" loop preload="auto"></audio>
<div class="hint">✨ 星光璀璨 · 生日快乐 ✨</div>

<script>
const canvas = document.getElementById('fw');
const ctx = canvas.getContext('2d');
let W, H, animId, timer, running = true;
let rockets = [], parts = [];

// 祝福文字
const CHARS = ['生','日','快','乐','天','天','开','心'];
let charIdx = 0;
let wordTimer = null;

function showChar(color) {
  if (!running) return;
  const ch = CHARS[charIdx % CHARS.length];
  charIdx++;
  const x = innerWidth*0.2 + Math.random()*innerWidth*0.6;
  const y = innerHeight*0.15 + Math.random()*innerHeight*0.5;

  const span = document.createElement('span');
  span.className = 'bless-char';
  span.textContent = ch;
  span.style.position = 'fixed';
  span.style.zIndex = '15';
  span.style.pointerEvents = 'none';
  span.style.left = x + 'px';
  span.style.top = y + 'px';
  span.style.fontSize = 'clamp(60px,11vw,130px)';
  span.style.fontFamily = "'ZCOOL KuaiLe', 'STXingkai', 'KaiTi', 'Microsoft YaHei', cursive";
  span.style.fontWeight = '400';
  span.style.color = color;
  span.style.textShadow = '0 0 15px currentColor, 0 0 40px currentColor';
  span.style.willChange = 'transform,opacity';
  span.style.animation = 'charPop 3s ease-out forwards';
  document.body.appendChild(span);
  setTimeout(() => span.remove(), 3100);
}

function startChars() {
  if (!running) return;
  showChar(C[Math.random()*C.length|0]);
  wordTimer = setTimeout(startChars, 1500);
}

// 超高饱和霓虹色
const C = ['#FF0000','#FFFF00','#00FF00','#0099FF','#FF00FF','#FF6600','#CC00FF','#FF0033','#00FFFF','#99FF00','#FFDD00','#FF0066','#00FF99','#FF3300','#6600FF','#FF0099'];

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// 粒子
class P {
  constructor(x,y,c,size,life,vx,vy) {
    this.x=x; this.y=y; this.c=c; this.size=size; this.life=life; this.max=life; this.vx=vx; this.vy=vy;
  }
}

// 火箭
class R {
  constructor(bx, by, tx, ty, color) {
    this.x=bx; this.y=by; this.tx=tx; this.ty=ty;
    this.vx=(tx-bx)/35; this.vy=(ty-by)/35-5;
    this.color=color; this.alive=true; this.trail=[];
  }
  update() {
    this.trail.push({x:this.x, y:this.y, a:1});
    if (this.trail.length>15) this.trail.shift();
    this.trail.forEach(t=>t.a-=0.1);
    this.x+=this.vx; this.y+=this.vy; this.vy+=0.05;
    if (this.vy>-0.5 || this.y<=this.ty) { this.alive=false; this.bang(); }
  }
  bang() {
    const mega = this.mega;
    const normalN = 70+Math.random()*45|0;
    const n = mega ? normalN*4 : normalN;
    for (let i=0;i<n;i++) {
      const a=Math.random()*Math.PI*2;
      const s=mega?2+Math.random()*5:1.5+Math.random()*4;
      const big=Math.random()<(mega?0.35:0.25);
      parts.push(new P(this.x,this.y, big?'#FFFFFF':this.color, big?4+Math.random()*6:2+Math.random()*4, (big?80:50)+Math.random()*60|0, Math.cos(a)*s, Math.sin(a)*s));
    }
    if (mega) {
      for (let i=0;i<80;i++) {
        const a=Math.random()*Math.PI*2;
        const s=0.8+Math.random()*2.5;
        parts.push(new P(this.x,this.y,'#FFFF00',2+Math.random()*5,40+Math.random()*40|0,Math.cos(a)*s,Math.sin(a)*s));
      }
    }
  }
  draw() {
    this.trail.forEach(t=>{ if(t.a>0) { ctx.beginPath(); ctx.arc(t.x,t.y,2*t.a,0,7); ctx.fillStyle='rgba(255,200,100,'+t.a*0.6+')'; ctx.fill(); } });
    ctx.beginPath(); ctx.arc(this.x,this.y,3,0,7); ctx.fillStyle='#FFF'; ctx.fill();
  }
}

function launch(mega) {
  if (!running) return;
  const cx=W/2+(Math.random()-0.5)*W*(mega?0.5:0.7);
  const tx=cx+(Math.random()-0.5)*(mega?350:200);
  const ty=mega?40+Math.random()*H*0.3:60+Math.random()*H*0.45;
  const color=C[Math.random()*C.length|0];
  const r=new R(cx, H+10, tx, ty, color);
  r.mega=mega||false;
  rockets.push(r);
  if (!mega) timer=setTimeout(()=>launch(false), 800+Math.random()*700);
}

function megaBang() {
  if (!running) return;
  launch(true);
  setTimeout(()=>{ if(running) launch(true); }, 300+Math.random()*400);
  setTimeout(()=>{ if(running) launch(true); }, 600+Math.random()*500);
  setTimeout(megaBang, 5000);
}

function loop() {
  ctx.clearRect(0,0,W,H);

  rockets=rockets.filter(r=>r.alive);
  parts=parts.filter(p=>p.life>0);
  if (parts.length>8000) parts=parts.slice(-5000);

  rockets.forEach(r=>{ r.update(); r.draw(); });
  // additive 混合让重叠粒子更亮
  ctx.globalCompositeOperation='lighter';
  for (let i=0;i<parts.length;i++) {
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.012; p.vx*=0.996; p.vy*=0.996; p.life--;
    const a=p.life/p.max, s=p.size*(0.5+0.5*a);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  animId=requestAnimationFrame(loop);
}

launch(false);
setTimeout(()=>{ if(running) launch(false); }, 300);
setTimeout(()=>{ if(running) launch(false); }, 600);
// 2秒后开始文字循环
setTimeout(()=>startChars(), 2000);
setTimeout(()=>megaBang(), 3000);
loop();

// 音乐控制
var musicPlaying = false;
var bgMusic = document.getElementById('bgMusic');
function toggleMusic() {
  if (musicPlaying) {
    bgMusic.pause();
    document.getElementById('musicBtn').classList.remove('playing');
    document.getElementById('musicBtn').textContent = '🎵';
  } else {
    bgMusic.play().catch(function(){});
    document.getElementById('musicBtn').classList.add('playing');
    document.getElementById('musicBtn').textContent = '🎶';
  }
  musicPlaying = !musicPlaying;
}
// 首次点击页面时自动播放音乐
document.addEventListener('click', function autoPlay() {
  if (bgMusic && bgMusic.paused) {
    bgMusic.play().then(function() {
      musicPlaying = true;
      document.getElementById('musicBtn').classList.add('playing');
      document.getElementById('musicBtn').textContent = '🎶';
    }).catch(function(){});
  }
}, { once: true });

function goBack() {
  running=false; clearTimeout(timer); clearTimeout(wordTimer);
  if(animId) cancelAnimationFrame(animId);
  if (bgMusic) { bgMusic.pause(); bgMusic.src = ''; }
  document.querySelectorAll('.bless-char').forEach(el=>el.remove());
  history.back();
}
</script>
</body>
</html>
